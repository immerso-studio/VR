/* === ANIMAZIONE PER MOUSE === */
.mouse-scroll {
  width: 40px;
  height: 70px;
  border: 3px solid white;
  border-radius: 20px;
  position: relative;
  margin: 0 auto;
}

.mouse-scroll::before {
  content: "";
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
  animation: scrollMouse 1.5s infinite ease-in-out;
}

@keyframes scrollMouse {
  0% { opacity: 0; transform: translate(-50%, 0); }
  50% { opacity: 1; transform: translate(-50%, 15px); }
  100% { opacity: 0; transform: translate(-50%, 30px); }
}

/* === ANIMAZIONE PER TOUCH (con cornice telefono) === */
.touch-scroll {
  width: 60px;
  height: 100px;
  border: 2px solid white;
  border-radius: 12px;
  position: relative;
  margin: 0 auto;
  box-shadow: 0 0 8px rgba(255,255,255,0.2);
}

/* piccolo "altoparlante" in alto */
.touch-scroll::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 3px;
  background: white;
  border-radius: 2px;
  opacity: 0.8;
}

/* dito animato all'interno del telefono */
.touch-scroll::after {
  content: "";
  position: absolute;
  top: 20px;
  left: 50%;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
  transform: translateX(-50%);
  animation: scrollTouch 1.5s infinite ease-in-out;
}

/* movimento inverso: dal basso verso l'alto */
@keyframes scrollTouch {
  0%   { transform: translate(-50%, 50px); opacity: 0; }
  25%  { opacity: 1; }
  50%  { transform: translate(-50%, 20px); opacity: 1; }
  75%  { opacity: 1; }
  100% { transform: translate(-50%, -10px); opacity: 0; }
}

/* Assicura che la modale sia sempre sopra tutto */
.modal-backdrop {
  z-index: 1040;
}

.modal {
  z-index: 1050;
}

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "GLTFLoader";
import { DRACOLoader } from "DRACOLoader";

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Impostazioni per mobile
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
const baseFOV = isMobile ? 40 : 35;

const camera = new THREE.PerspectiveCamera(baseFOV, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 3);

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

let mixer, action, dummyCamera;
let targetScrollValue = 0;
let currentScrollValue = 0;
const scrollSensitivity = isMobile ? 0.0004 : 0.0002;
const smoothFactor = 0.009;

const snapPoints = [0.001, 0.35, 0.5, 0.6];
const snapThreshold = 0.02;

let touchStartY = 0;
let isScrolling = false;

let hoodMixer = null;
let hoodAction = null;
let isHoodAnimationPlaying = false;
let hoodAnimationDuration = 0;
let isHoodAnimationReversing = false;

const markerVisibilityState = {};
let isSnappingFromMenu = false;

// Configuratore - proprietà di visibilità
const configuratorVisibility = {
  fadeInStart: 0.34,
  fullyVisible: 0.35,
  fadeOutStart: 0.36,
  fadeOutEnd: 0.37
};

// Variabili per gestire lo scroll
let scrollPosition = 0;
let isModalOpen = false;
let currentMarkerId = null;

// Funzione per bloccare lo scroll dello sfondo
function disableBodyScroll() {
  scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
  document.body.style.overflow = 'hidden';
  document.body.style.position = 'fixed';
  document.body.style.top = `-${scrollPosition}px`;
  document.body.style.width = '100%';
  document.body.style.height = '100%';
}

// Funzione per riabilitare lo scroll dello sfondo
function enableBodyScroll() {
  document.body.style.removeProperty('overflow');
  document.body.style.removeProperty('position');
  document.body.style.removeProperty('top');
  document.body.style.removeProperty('width');
  document.body.style.removeProperty('height');
  window.scrollTo(0, scrollPosition);
}

// Loading progress
function updateProgress(progress) {
  const progressBar = document.querySelector('.progress-bar');
  progressBar.style.width = `${progress}%`;
}
let povLoaded = false;
let cameraPathLoaded = false;
function tryHideLoader() {
  if (povLoaded && cameraPathLoaded) {
    updateProgress(100);
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('startScreen').classList.add('show');
    }, 500);
  }
}

let isStarted = false;
let isTutorialActive = false;


document.getElementById("startButton").addEventListener("click", () => {
  document.getElementById("startScreen").classList.remove("show");
  isStarted = true;
  animate();
  showTutorial(); // 👈 Mostra la scheda tutorial dopo START
});



// Caricamenti
loader.load("./assets/DEMO/ff_pov.glb", (gltf) => {
  scene.add(gltf.scene);
  gltf.scene.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  const hoodClip = THREE.AnimationClip.findByName(gltf.animations, "ff_split-001_hood-001Action");
  if (hoodClip) {
    hoodMixer = new THREE.AnimationMixer(gltf.scene);
    hoodAction = hoodMixer.clipAction(hoodClip);
    hoodAnimationDuration = hoodClip.duration;
    hoodAction.setLoop(THREE.LoopOnce);
    hoodAction.clampWhenFinished = true;
    hoodAction.paused = true;
  }
  updateProgress(50);
  povLoaded = true;
  tryHideLoader();
});
loader.load("./assets/DEMO/camera_paths.glb", (gltf) => {
  scene.add(gltf.scene);
  mixer = new THREE.AnimationMixer(gltf.scene);
  const clip = THREE.AnimationClip.findByName(gltf.animations, "ff_empty_action");
  if (clip) {
    action = mixer.clipAction(clip);
    action.play();
  }
  dummyCamera = gltf.scene.getObjectByName("ff_empty");

window.addEventListener("wheel", (event) => {
  if (!isStarted || isModalOpen || isTutorialActive) return; // 👈 blocca anche durante tutorial
  const isMouseScroll = Math.abs(event.deltaY) % 120 === 0;
  const sensitivity = isMouseScroll ? scrollSensitivity * 0.5 : scrollSensitivity;
  targetScrollValue += event.deltaY * sensitivity;
  targetScrollValue = Math.max(0, Math.min(1, targetScrollValue));
  event.preventDefault();
}, { passive: false });

// === TOUCH (mobile) ===
window.addEventListener('touchstart', (event) => {
  if (!isStarted || isModalOpen || isTutorialActive) return; // 👈 blocca anche qui
  touchStartY = event.touches[0].clientY;
  isScrolling = true;
}, { passive: true });

window.addEventListener('touchmove', (event) => {
  if (!isStarted || isModalOpen || isTutorialActive) return; // 👈 blocca anche qui
  if (!isScrolling) return;
  const touchY = event.touches[0].clientY;
  const deltaY = touchStartY - touchY;
  touchStartY = touchY;
  targetScrollValue += deltaY * scrollSensitivity * 2;
  targetScrollValue = Math.max(0, Math.min(1, targetScrollValue));
  event.preventDefault();
}, { passive: false });


window.addEventListener('touchend', () => { if (!isModalOpen) isScrolling = false; });
document.addEventListener('touchmove', (e) => { if (e.target.tagName === 'CANVAS') e.preventDefault(); }, { passive: false });

const markerModal = new bootstrap.Modal(document.getElementById('markerModal'));
function showModal(title, content) {
  const targetFOV = Math.max(25, baseFOV - 5);
  gsap.to(camera,{ fov: targetFOV,duration: 0.8,ease: "power2.inOut",onUpdate: () => camera.updateProjectionMatrix() });
  document.getElementById('markerModalLabel').textContent = title;
  const modalBody = document.querySelector('.modal-body');
  modalBody.innerHTML = content;
  gsap.set(modalBody.children,{ opacity: 0, y: 20 });
  markerModal.show();
  gsap.timeline({ delay: 0.2 }).to(modalBody.children,{ opacity: 1,y: 0,duration: 0.4,stagger: 0.2,ease: "power2.out" });
  document.getElementById('markerModal').addEventListener('hidden.bs.modal', () => {
    gsap.to(camera,{ fov: baseFOV,duration: 0.8,ease: "power2.inOut",onUpdate: () => camera.updateProjectionMatrix() });
  }, {once: true});
}
function updateMarker(markerData) {
  const markerElement = document.getElementById(markerData.id);
  if (markerVisibilityState[markerData.id] === false) {
    markerElement.style.opacity = 0;
    markerElement.style.pointerEvents = "none";
    return;
  }
  let opacity = 0;
  if (currentScrollValue >= markerData.fadeInStart && currentScrollValue <= markerData.fullyVisible) {
    opacity = (currentScrollValue - markerData.fadeInStart) / Math.max(0.000001,(markerData.fullyVisible - markerData.fadeInStart));
  } else if (currentScrollValue > markerData.fullyVisible && currentScrollValue < markerData.fadeOutStart) {
    opacity = 1;
  } else if (currentScrollValue >= markerData.fadeOutStart && currentScrollValue <= markerData.fadeOutEnd) {
    opacity = 1 - (currentScrollValue - markerData.fadeOutStart) / Math.max(0.000001,(markerData.fadeOutEnd - markerData.fadeOutStart));
  }
  const vector = markerData.position.clone();
  vector.project(camera);
  const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
  markerElement.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
  const inViewport = (vector.z < 1 && vector.x > -1 && vector.x < 1 && vector.y > -1 && vector.y < 1);
  markerElement.style.opacity = inViewport ? opacity : 0;
  markerElement.style.pointerEvents = (inViewport && opacity > 0.6) ? "auto" : "none";
}

      isHoodAnimationPlaying = true;isHoodAnimationReversing = false;
    }

    showModal(marker.title, marker.content);
  });
});

// Slider snap menu
function centerActiveSnapButton() {
  const activeButton = document.querySelector('.snap-btn.active');
  const menu = document.getElementById('snap-menu');
  if (!activeButton || !menu) return;

  setTimeout(() => {
    const menuRect = menu.getBoundingClientRect();
    const buttonRect = activeButton.getBoundingClientRect();
    const targetScrollLeft =
      menu.scrollLeft +
      (buttonRect.left - menuRect.left) -
      (menuRect.width / 2 - buttonRect.width / 2);

    gsap.to(menu, {
      scrollTo: { x: targetScrollLeft },
      duration: 0.5,
      ease: "power2.out"
    });
  }, 50);
}


function updateSnapMenu() {
  const buttons = document.querySelectorAll('.snap-btn');
  let activeFound = false;
  buttons.forEach(button => {
    const snapValue = parseFloat(button.dataset.snap);
    const isActive = Math.abs(currentScrollValue - snapValue) < snapThreshold;
    if (isActive) {
      button.classList.add('active');
      activeFound = true;
    } else {
      button.classList.remove('active');
    }
  });
  if (activeFound) centerActiveSnapButton();
}

// Variabili per il configuratore
let currentModel = null;
let currentModelIndex = 0;
const modelConfigs = [
  { 
    path: "./assets/DEMO/3D/lampada_1.glb", 
    name: "Lampada 1"

  { 
    path: "./assets/DEMO/3D/Lampada_2.glb", 
    name: "Lampada 2"
  }
];

// Funzione per caricare un modello nel configuratore
function loadConfiguratorModel(modelIndex) {
  // Rimuovi il modello precedente se esiste
  if (currentModel) {
    scene.remove(currentModel);
    currentModel = null;
  }
  
  const modelConfig = modelConfigs[modelIndex];
  
  // Carica il nuovo modello
  loader.load(modelConfig.path, (gltf) => {
    currentModel = gltf.scene;
    
    // MANTIENE LE COORDINATE ORIGINALI DI BLENDER
    // Non applicare trasformazioni aggiuntive
    
    // Aggiungi il modello alla scena
    scene.add(currentModel);
    
    // Aggiorna il nome del modello visualizzato
    document.getElementById('current-model-name').textContent = modelConfig.name;
    
    // Aggiungi ombre al modello
    currentModel.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
  });
}

// Funzione per cambiare modello (avanti/indietro)
function changeModel(direction) {
  currentModelIndex += direction;
  
  // Gestisci il ciclo dei modelli
  if (currentModelIndex < 0) {
    currentModelIndex = modelConfigs.length - 1;
  } else if (currentModelIndex >= modelConfigs.length) {
    currentModelIndex = 0;
  }
  
  // Carica il nuovo modello
  loadConfiguratorModel(currentModelIndex);
}

// Inizializza il configuratore
function initConfigurator() {
  // Aggiungi event listener per le frecce
  document.getElementById('prev-model').addEventListener('click', () => {
    changeModel(-1);
  });
  
  document.getElementById('next-model').addEventListener('click', () => {
    changeModel(1);
  });
  
  // Carica il primo modello (cilindro) all'avvio
  loadConfiguratorModel(0);
}

// Funzione per aggiornare la visibilità del configuratore in base allo scroll
function updateConfiguratorVisibility() {
  const configurator = document.getElementById('configurator');
  let opacity = 0;
  
  if (currentScrollValue >= configuratorVisibility.fadeInStart && 
      currentScrollValue <= configuratorVisibility.fullyVisible) {
    // Fase di fade in
    opacity = (currentScrollValue - configuratorVisibility.fadeInStart) / 
              Math.max(0.000001, (configuratorVisibility.fullyVisible - configuratorVisibility.fadeInStart));
  } 
  else if (currentScrollValue > configuratorVisibility.fullyVisible && 
           currentScrollValue < configuratorVisibility.fadeOutStart) {
    // Completamente visibile
    opacity = 1;
  } 
  else if (currentScrollValue >= configuratorVisibility.fadeOutStart && 
           currentScrollValue <= configuratorVisibility.fadeOutEnd) {
    // Fase di fade out
    opacity = 1 - (currentScrollValue - configuratorVisibility.fadeOutStart) / 
              Math.max(0.000001, (configuratorVisibility.fadeOutEnd - configuratorVisibility.fadeOutStart));
  }
  
  // Applica l'opacità e disabilita l'interazione quando trasparente
  configurator.style.opacity = opacity;
  configurator.style.pointerEvents = (opacity > 0.6) ? 'auto' : 'none';
}

// Animate function - Versione migliorata
function animate() {
  requestAnimationFrame(animate);
  
  if (isSnappingFromMenu) {
    // Animazione smooth verso lo snap point selezionato dal menu
    const diff = targetScrollValue - currentScrollValue;
    currentScrollValue += diff * 0.01; // Fattore di smoothing aumentato
    
    // Se siamo molto vicini al target, considera il movimento completato
    if (Math.abs(diff) < 0.0005) {
      currentScrollValue = targetScrollValue;
    }
  } else {
    // Comportamento originale per lo scroll normale
    const diff = targetScrollValue - currentScrollValue;
    currentScrollValue += diff * smoothFactor;
    
    // Snap naturale durante lo scrolling
    for (let snap of snapPoints) {
      if (Math.abs(currentScrollValue - snap) < snapThreshold) {
        targetScrollValue = THREE.MathUtils.lerp(targetScrollValue, snap, 0.02);
      }
    }
  }

  
  if (mixer && action) {
    let duration = action.getClip().duration;
    mixer.setTime(currentScrollValue * duration);
    if (dummyCamera) {
      camera.position.copy(dummyCamera.position);
      camera.quaternion.copy(dummyCamera.quaternion);
    }
  }
  
  if (hoodMixer) {
    const delta = 0.016;
    hoodMixer.update(delta);
    if (isHoodAnimationPlaying && !isHoodAnimationReversing && hoodAction.time >= hoodAnimationDuration) hoodAction.paused = true;
    if (isHoodAnimationReversing && hoodAction.time <= 0) {
      hoodAction.paused = true;
      isHoodAnimationPlaying = false;
      isHoodAnimationReversing = false;
    }
  }
  
  markers.forEach(updateMarker);
  updateSnapMenu();
  updateConfiguratorVisibility(); // AGGIUNGI QUESTA RIGA
  renderer.render(scene, camera);
}
animate();
