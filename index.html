<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VR Portal Room with Video Texture</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      pointer-events: none;
      z-index: 10;
    }
    /* Schermata di caricamento */
    #loading {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: Arial, sans-serif;
      z-index: 100;
      transition: opacity 0.8s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #progress-bar {
      width: 200px;
      height: 6px;
      background: #333;
      margin-top: 15px;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #ff88cc;
      transition: width 0.2s;
    }
    #progress-text {
      margin-bottom: 5px;
      font-size: 14px;
    }
  </style>

  <!-- Preload dei file critici per anticipare il download -->
  <link rel="preload" href="assets/video/portale.mp4" as="media" type="video/mp4" crossorigin="anonymous">
  <link rel="preload" href="assets/alice/Stanza-scansionata-3.glb" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/alice/Porta-animata-2.glb" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/hdris/tile--.jpg" as="image">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">Walk through the pink portal to enter the alternate reality<br>Press 'R' to reset</div>

  <!-- Schermata di caricamento -->
  <div id="loading">
    <div id="progress-text">Loading 0%</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // --- Riferimenti globali ---
    let camera, cameraRig, renderer;
    let sceneA, sceneB, activeScene;
    let portalCenterMesh;
    let logoMesh;
    let switched = false;
    let doorMixer;
    let doorSound;
    let doorSoundPlayed = false;
    let backgroundMusic;
    let clock = new THREE.Clock();
    let contextSphere;
    let blackFadePlane, blackFadeMaterial;
    let logoShown = false;
    let doorOpened = false;
    let startTime = null;
    let portalSwitchTriggered = false;
    let portalSwitchTime = null;
    let essentialLoaded = false;    // stanza + porta + video pronti
    let allAssetsLoaded = false;   // tutto, inclusa scena B

    // Elementi UI caricamento
    const loadingEl = document.getElementById('loading');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    // --- Gestione caricamento centralizzata ---
    const manager = new THREE.LoadingManager();
    manager.onProgress = (url, loaded, total) => {
      const percent = Math.round((loaded / total) * 100);
      progressText.textContent = `Loading ${percent}%`;
      progressFill.style.width = `${percent}%`;
    };

    manager.onLoad = () => {
      allAssetsLoaded = true;
      // Nascondi la schermata di caricamento con dissolvenza
      loadingEl.classList.add('hidden');
      // Avvia il loop di rendering solo ora
      clock.start();
      startTime = null;   // verrà impostato al primo frame
      animate();
      // Carica ora gli asset non essenziali (audio) in background
      loadNonEssentialAssets();
    };

    // Caricatore texture condiviso
    const textureLoader = new THREE.TextureLoader(manager);
    // Caricatore GLB con DRACO
    const dracoLoader = new DRACOLoader(manager);
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    const gltfLoader = new GLTFLoader(manager);
    gltfLoader.setDRACOLoader(dracoLoader);

    // === INIZIALIZZAZIONE ===
    init();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = false; // nessuna ombra reale nello scene, risparmia memoria
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0.3, 1.5, 0);

      cameraRig = new THREE.Group();
      cameraRig.position.set(0, 0, 4);
      cameraRig.add(camera);

      // Scene A (principale)
      sceneA = new THREE.Scene();
      sceneA.background = new THREE.Color(0x222222);
      sceneA.add(cameraRig);
      addLights(sceneA);

      // Pavimento
      textureLoader.load('assets/hdris/tile--.jpg', (floorTexture) => {
        floorTexture.wrapS = THREE.RepeatWrapping;
        floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({
          map: floorTexture,
          roughness: 0.6,
          metalness: 0.0
        });
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = false;
        sceneA.add(floor);
      });

      // Video texture del portale
      const video = document.createElement('video');
      video.src = 'assets/video/portale.mp4';
      video.crossOrigin = 'anonymous';
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.play().catch(() => {});

      const videoTexture = new THREE.VideoTexture(video);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;
      videoTexture.colorSpace = THREE.SRGBColorSpace;

      const cubeGeo = new THREE.BoxGeometry(1.1, 2.6, 0.01);
      const cubeMat = new THREE.MeshStandardMaterial({
        map: videoTexture,
        side: THREE.DoubleSide,
        metalness: 0.5,
        roughness: 0.1
      });
      portalCenterMesh = new THREE.Mesh(cubeGeo, cubeMat);
      portalCenterMesh.position.set(0.4, 1.3, -0.05);
      sceneA.add(portalCenterMesh);

      // Logo (dopo 30s) - caricamento normale
      textureLoader.load('assets/video/LOGO-3D-GOLD.png', (logoTexture) => {
        logoTexture.colorSpace = THREE.SRGBColorSpace;
        const logoMaterial = new THREE.MeshBasicMaterial({
          map: logoTexture,
          transparent: true,
          opacity: 0,
          blending: THREE.NormalBlending,
          alphaTest: 0.01,
          depthWrite: false,
        });
        const logoGeometry = new THREE.PlaneGeometry(2, 2);
        logoMesh = new THREE.Mesh(logoGeometry, logoMaterial);
        logoMesh.position.set(0.3, 1.6, 1.7);
        sceneA.add(logoMesh);
      });

      // Modelli GLB principali (stanza + porta)
      loadEssentialModels();

      // Scene B (alternativa) – caricata dopo ma prima che il portale sia utilizzabile
      sceneB = new THREE.Scene();
      sceneB.background = new THREE.Color(0x003366);
      sceneB.add(cameraRig);
      addLights(sceneB);
      loadSceneBModel();

      // HDR per la scena B
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      new RGBELoader(manager)
        .setPath('assets/hdris/')
        .load('trees.hdr', (hdrTexture) => {
          hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
          hdrTexture.colorSpace = THREE.SRGBColorSpace;
          const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
          sceneB.environment = envMap;
          hdrTexture.dispose();
          pmremGenerator.dispose();
        });

      // Sfera di contesto per scena B
      textureLoader.load('assets/context.jpeg', (texture) => {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        const sphereGeo = new THREE.SphereGeometry(50, 100, 40);
        const sphereMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
        contextSphere = new THREE.Mesh(sphereGeo, sphereMat);
        contextSphere.visible = false;
        sceneB.add(contextSphere);
      });

      // Fade nero per la transizione
      blackFadeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 });
      const blackFadeGeometry = new THREE.PlaneGeometry(10, 10);
      blackFadePlane = new THREE.Mesh(blackFadeGeometry, blackFadeMaterial);
      blackFadePlane.position.set(0, 0, -1);
      camera.add(blackFadePlane);

      // Scena attiva iniziale
      activeScene = sceneA;

      // Eventi
      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') resetExperience();
      });
      window.addEventListener('resize', onWindowResize);

      // WebXR session start/end per la musica
      renderer.xr.addEventListener('sessionstart', () => {
        clock.start();
        startTime = null;
        logoShown = false;
        doorOpened = false;
        doorSoundPlayed = false;
        portalSwitchTriggered = false;
        portalSwitchTime = null;
        blackFadeMaterial.opacity = 0;
        cameraRig.position.set(0.3, 0.3, 2.5);
        if (backgroundMusic) {
          backgroundMusic.currentTime = 0;
          backgroundMusic.play().catch(() => {});
        }
      });

      renderer.xr.addEventListener('sessionend', () => {
        if (backgroundMusic) {
          backgroundMusic.pause();
          backgroundMusic.currentTime = 0;
        }
      });
    }

    function loadEssentialModels() {
      // Stanza principale
      gltfLoader.load('assets/alice/Stanza-scansionata-3.glb', gltf => {
        gltf.scene.scale.set(1.3, 1.3, 1.3);
        gltf.scene.traverse(child => {
          if (child.isMesh) {
            child.castShadow = false;
            child.receiveShadow = false;
          }
        });
        sceneA.add(gltf.scene);
        checkEssentialReady();
      });

      // Porta animata
      gltfLoader.load('assets/alice/Porta-animata-2.glb', gltf => {
        gltf.scene.scale.set(1.3, 1.3, 1.3);
        gltf.scene.traverse(child => {
          if (child.isMesh) {
            child.castShadow = false;
            child.receiveShadow = false;
          }
        });
        sceneA.add(gltf.scene);
        doorMixer = new THREE.AnimationMixer(gltf.scene);
        gltf.animations.forEach(clip => {
          const action = doorMixer.clipAction(clip);
          action.clampWhenFinished = true;
          action.loop = THREE.LoopOnce;
        });
        checkEssentialReady();
      });
    }

    function checkEssentialReady() {
      // Semplice flag: quando entrambi i modelli sono caricati e il video è pronto
      if (essentialLoaded) return;
      const roomLoaded = sceneA.children.some(c => c.type === 'Scene' && c.scale.x === 1.3); // controllo approssimativo
      // Basta fidarsi dei loader: verrà chiamato quando entrambi i GLB hanno finito
      // Possiamo usare un contatore manuale, ma qui usiamo un approccio: quando il manager avanza,
      // alla fine tutto sarà caricato. Per garantire l'avvio rapido, avvierei il loop dopo che
      // i due modelli essenziali sono stati processati. Useremo una variabile contatore.
    }

    function loadSceneBModel() {
      gltfLoader.load('assets/alice/Prova-teaparty-5.glb', gltf => {
        gltf.scene.scale.set(2, 2, 2);
        gltf.scene.traverse(child => {
          if (child.isMesh) {
            child.castShadow = false;
            child.receiveShadow = false;
          }
        });
        sceneB.add(gltf.scene);
      });
    }

    function loadNonEssentialAssets() {
      // Audio porta
      doorSound = new Audio('assets/video/porta-sound.mp3');
      doorSound.preload = 'auto';
      doorSound.volume = 0.8;

      // Musica di sottofondo
      backgroundMusic = new Audio('assets/alice/musica.mp3');
      backgroundMusic.loop = true;
      backgroundMusic.preload = 'auto';
      backgroundMusic.volume = 0.5;
    }

    function resetExperience() {
      switched = false;
      portalSwitchTriggered = false;
      activeScene = sceneA;
      cameraRig.position.set(0, 0, 3);
      if (contextSphere) contextSphere.visible = false;
      blackFadeMaterial.opacity = 0;
      clock.start();
      startTime = null;
      logoShown = false;
      doorOpened = false;
      doorSoundPlayed = false;
      portalSwitchTime = null;
    }

    // --- LOOP PRINCIPALE ---
    function animate() {
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        if (startTime === null) startTime = elapsed;
        const relativeTime = elapsed - startTime;

        if (doorMixer) doorMixer.update(delta);

        // Logo dopo 30s
        if (relativeTime >= 30 && logoMesh && !logoShown) {
          logoShown = true;
        }
        if (logoShown && logoMesh && logoMesh.material.opacity < 1) {
          logoMesh.material.opacity = Math.min(1, logoMesh.material.opacity + delta);
        }

        // Apertura porta dopo 45s
        if (relativeTime >= 45 && !doorOpened) {
          doorOpened = true;
          if (doorMixer) {
            doorMixer.stopAllAction();
            doorMixer._actions.forEach(action => {
              action.reset();
              action.play();
            });
          }
        }

        // Suono porta dopo 48.5s
        if (relativeTime >= 48.5 && doorSound && !doorSoundPlayed) {
          doorSoundPlayed = true;
          doorSound.currentTime = 0;
          doorSound.play().catch(() => {});
        }

        // Controllo ingresso nel portale (solo se tutti gli asset sono pronti)
        if (allAssetsLoaded) {
          checkPortalEntry(elapsed);
        }

        // Effetto fade transizione
        if (portalSwitchTriggered && portalSwitchTime !== null) {
          const timeSinceSwitch = elapsed - portalSwitchTime;
          if (timeSinceSwitch < 3) {
            blackFadeMaterial.opacity = 1;
          } else if (timeSinceSwitch >= 3 && timeSinceSwitch <= 8) {
            blackFadeMaterial.opacity = 1 - ((timeSinceSwitch - 3) / 8);
          } else {
            blackFadeMaterial.opacity = 0;
          }
        }

        updatePortalEffect();
        renderer.render(activeScene, camera);
      });
    }

    function checkPortalEntry(currentTime) {
      if (switched || portalSwitchTriggered) return;
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      const portalBox = new THREE.Box3().setFromObject(portalCenterMesh).expandByScalar(0.2);
      if (portalBox.containsPoint(camPos)) {
        portalSwitchTriggered = true;
        portalSwitchTime = currentTime;
        activeScene = sceneB;
        if (contextSphere) contextSphere.visible = true;
      }
    }

    function updatePortalEffect() {
      if (switched || !portalCenterMesh) return;
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      const portalPos = new THREE.Vector3();
      portalCenterMesh.getWorldPosition(portalPos);
      const distance = camPos.distanceTo(portalPos);
      const maxDistance = 2.0;
      const intensity = Math.max(0, (maxDistance - distance) / maxDistance);
      portalCenterMesh.material.emissiveIntensity = intensity * 2;
    }

    function addLights(scene) {
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
      hemi.position.set(0, 1, 0);
      scene.add(hemi);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
