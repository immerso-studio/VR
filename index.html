<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Portal Room</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">Walk through the pink portal to enter the alternate reality<br>Press 'R' to reset</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    let camera, renderer;
    let sceneA, sceneB, activeScene;
    let portalCenterMesh;
    let switched = false;
    let roomAObject = null; // 🔸 Per riferimento alla scena A

    init();
    animate();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 3);

      // Scene A
      sceneA = new THREE.Scene();
      sceneA.background = new THREE.Color(0x222222);
      addLights(sceneA);
      loadRoom(sceneA);

      // Portal (plane)
      const cubeGeo = new THREE.BoxGeometry(1.5, 3.5, 0);
      const cubeMat = new THREE.MeshStandardMaterial({ 
        color: 0x000000,
        emissive: 0x000000,
        metalness: 0.5,
        roughness: 0.1
      });
      portalCenterMesh = new THREE.Mesh(cubeGeo, cubeMat);
      portalCenterMesh.position.set(0, 1.7, -2.8);
      sceneA.add(portalCenterMesh);

      // Door model around portal
      loadDoorModel(sceneA);

      // Scene B
      sceneB = new THREE.Scene();
      sceneB.background = new THREE.Color(0x003366);
      addLights(sceneB);
      loadAltRoom(sceneB);

      activeScene = sceneA;

      // Reset handler
      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          switched = false;
          activeScene = sceneA;
          camera.position.set(0, 1.6, 3);
          console.log("Scene reset");
        }
      });

      window.addEventListener('resize', onWindowResize);

      // 🔸 Attiva animazione dopo 10 sec in VR
      renderer.xr.addEventListener('sessionstart', () => {
        console.log("🎮 VR session started");

        setTimeout(() => {
          if (roomAObject) {
            animateRoomScale(roomAObject, new THREE.Vector3(10, 10, 10), 3); // 2 sec animazione
          }
        }, 10000); // ⏳ 10 sec delay
      });
    }

    function addLights(scene) {
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      hemi.position.set(0, 1, 0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(3, 10, 10);
      dir.castShadow = true;
      dir.shadow.mapSize.width = 2048;
      dir.shadow.mapSize.height = 2048;
      scene.add(dir);
    }

    function loadRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-1.glb', function (gltf) {
        gltf.scene.scale.set(2, 2, 2);
        roomAObject = gltf.scene; // 🔸 salva il riferimento
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Error loading GLB (Scene A):', error);
      });
    }

    function loadAltRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-3.glb', function (gltf) {
        gltf.scene.scale.set(2, 2, 2);
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Error loading GLB (Scene B):', error);
      });
    }

    function loadDoorModel(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Porta.glb', function (gltf) {
        const door = gltf.scene;
        door.position.set(0, 0, 0); // Match portal position
        door.scale.set(1.5, 1.5, 1.5); // Adjust if needed
        scene.add(door);
      }, undefined, function (error) {
        console.error('Error loading door model:', error);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        checkPortalEntry();
        updatePortalEffect();
        renderer.render(activeScene, camera);
      });
    }

    function checkPortalEntry() {
      if (switched) return;

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      const portalBox = new THREE.Box3().setFromObject(portalCenterMesh);
      portalBox.expandByScalar(0.2);

      if (portalBox.containsPoint(camPos)) {
        console.log("✅ PORTAL ENTERED");
        switched = true;
        activeScene = sceneB;

        setTimeout(() => {
          switched = false;
        }, 2000);
      }
    }

    function updatePortalEffect() {
      if (switched || !portalCenterMesh) return;

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      const portalPos = new THREE.Vector3();
      portalCenterMesh.getWorldPosition(portalPos);

      const distance = camPos.distanceTo(portalPos);
      const maxDistance = 2.0;

      const intensity = Math.max(0, (maxDistance - distance) / maxDistance);
      portalCenterMesh.material.emissiveIntensity = intensity * 2;
    }

    // 🔸 Animazione scala con interpolazione
    function animateRoomScale(object, targetScale, duration) {
      const initialScale = object.scale.clone();
      const startTime = performance.now();

      function update() {
        const elapsed = (performance.now() - startTime) / 1000;
        const t = Math.min(elapsed / duration, 1);
        object.scale.lerpVectors(initialScale, targetScale, t);
        if (t < 1) requestAnimationFrame(update);
      }

      update();
    }
  </script>
</body>
</html>
