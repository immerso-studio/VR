<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Portal Room</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    let camera, renderer;
    let sceneA, sceneB, activeScene;
    let portalCenterMesh;
    let switched = false;

    init();
    animate();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 3);

      // Scene A
      sceneA = new THREE.Scene();
      sceneA.background = new THREE.Color(0x222222);
      addLights(sceneA);
      loadRoom(sceneA);

      // Portale visivo (cubo)
      const cubeGeo = new THREE.BoxGeometry(1, 2, 0.1);
      const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff00ff });
      portalCenterMesh = new THREE.Mesh(cubeGeo, cubeMat);
      portalCenterMesh.position.set(0, 1.6, -1.5); // davanti all'utente
      sceneA.add(portalCenterMesh);

      // Scene B (ambiente alternativo)
      sceneB = new THREE.Scene();
      sceneB.background = new THREE.Color(0x003366);
      addLights(sceneB);
      loadAltRoom(sceneB); // Load GLB in Scene B

      activeScene = sceneA;

      window.addEventListener('resize', onWindowResize);
    }

    function addLights(scene) {
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      hemi.position.set(0, 1, 0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(3, 10, 10);
      scene.add(dir);
    }

    function loadRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-1.glb', function (gltf) {
        gltf.scene.scale.set(2, 2, 2);
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Errore nel caricamento GLB (Scene A):', error);
      });
    }

    function loadAltRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-2.glb', function (gltf) {
        gltf.scene.scale.set(2, 2, 2);
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Errore nel caricamento GLB (Scene B):', error);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        checkPortalEntry();
        renderer.render(activeScene, camera);
      });
    }

    function checkPortalEntry() {
      if (switched) return;

      const xrCamera = renderer.xr.getCamera(camera); // XR-aware camera
      const camPos = new THREE.Vector3();
      xrCamera.getWorldPosition(camPos);

      const portalPos = portalCenterMesh.getWorldPosition(new THREE.Vector3());
      const distance = camPos.distanceTo(portalPos);

      if (distance < 0.5) {
        console.log("✅ PORTALE ATTRAVERSATO");
        switched = true;
        activeScene = sceneB;
      }
    }
  </script>
</body>
</html>
