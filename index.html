<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Portal Room</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">Walk through the pink portal to enter the alternate reality<br>Press 'R' to reset</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    let camera, renderer;
    let sceneA, sceneB, activeScene;
    let portalCenterMesh;
    let switched = false;

    init();
    animate();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 3);

      // Scene A
      sceneA = new THREE.Scene();
      sceneA.background = new THREE.Color(0x222222);
      addLights(sceneA);
      loadRoom(sceneA);

      // Portal (cube)
      const cubeGeo = new THREE.BoxGeometry(1, 2, 0.1);
      const cubeMat = new THREE.MeshStandardMaterial({ 
        color: 0xff00ff,
        emissive: 0xff00ff,
        metalness: 0.5,
        roughness: 0.1
      });
      portalCenterMesh = new THREE.Mesh(cubeGeo, cubeMat);
      portalCenterMesh.position.set(0, 1.6, -1.5); // In front of user
      sceneA.add(portalCenterMesh);

      // Add a frame around the portal for better visibility
      const frameGeo = new THREE.BoxGeometry(1.2, 2.2, 0.15);
      const frameMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff,
        side: THREE.BackSide
      });
      const portalFrame = new THREE.Mesh(frameGeo, frameMat);
      portalFrame.position.copy(portalCenterMesh.position);
      sceneA.add(portalFrame);

      // Scene B (alternate environment)
      sceneB = new THREE.Scene();
      sceneB.background = new THREE.Color(0x003366);
      addLights(sceneB);
      loadAltRoom(sceneB);

      activeScene = sceneA;

      // Add reset handler
      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          switched = false;
          activeScene = sceneA;
          camera.position.set(0, 1.6, 3);
          console.log("Scene reset");
        }
      });

      window.addEventListener('resize', onWindowResize);
    }

    function addLights(scene) {
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      hemi.position.set(0, 1, 0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(3, 10, 10);
      dir.castShadow = true;
      dir.shadow.mapSize.width = 2048;
      dir.shadow.mapSize.height = 2048;
      scene.add(dir);
    }

    function loadRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-1.glb', function (gltf) {
        gltf.scene.scale.set(2, 2, 2);
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Error loading GLB (Scene A):', error);
      });
    }

    function loadAltRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-2.glb', function (gltf) {
        gltf.scene.scale.set(2, 2, 2);
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Error loading GLB (Scene B):', error);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        checkPortalEntry();
        updatePortalEffect();
        renderer.render(activeScene, camera);
      });
    }

    function checkPortalEntry() {
      if (switched) return;

      // Get the VR camera's position in world space
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      // Get the portal's position in world space
      const portalPos = new THREE.Vector3();
      portalCenterMesh.getWorldPosition(portalPos);

      // Create a bounding box for the portal
      const portalBox = new THREE.Box3().setFromObject(portalCenterMesh);
      
      // Expand the box slightly for better detection
      portalBox.expandByScalar(0.2);

      if (portalBox.containsPoint(camPos)) {
        console.log("✅ PORTAL ENTERED");
        switched = true;
        activeScene = sceneB;
        
        // Add a small delay before allowing another switch
        setTimeout(() => {
          switched = false;
        }, 2000);
      }
    }

    function updatePortalEffect() {
      if (switched || !portalCenterMesh) return;

      // Get camera distance to portal for visual effect
      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);
      
      const portalPos = new THREE.Vector3();
      portalCenterMesh.getWorldPosition(portalPos);
      
      const distance = camPos.distanceTo(portalPos);
      const maxDistance = 2.0;
      
      // Make portal pulse based on distance
      const intensity = Math.max(0, (maxDistance - distance) / maxDistance);
      portalCenterMesh.material.emissiveIntensity = intensity * 2;
      
      // Make portal slightly animate
      portalCenterMesh.scale.y = 1 + Math.sin(Date.now() * 0.001) * 0.05 * intensity;
      portalCenterMesh.scale.x = 1 + Math.cos(Date.now() * 0.0012) * 0.05 * intensity;
    }
  </script>
</body>
</html>
