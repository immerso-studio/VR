<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Montaga&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">


  <title>Punti Interattivi UI</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    #infoCard {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #infoCard.show {
      opacity: 1;
      pointer-events: auto;
    }

    #infoCardContent {
      background-image: url('assets/schede/papiro3.png');
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: top;
      background-attachment: local;

      padding: 40px;
      border-radius: 12px;
      max-width: 300px;
      max-height: 70vh;
      overflow-y: auto;
      position: relative;
      color: #000000;
      transform: scale(0.95);
      transition: transform 0.4s ease;
    }



    #infoCard.show #infoCardContent {
      transform: scale(1);
    }

    #infoTitle {
      margin-top: 0;
      margin-right: 50px;
      font-family: 'cinzel', serif;
      font-weight: bold;
      line-height: 25px;
    }

    #infoText {

      font-family: 'Montaga', serif;
    }


    #closeBtn {
      position: fixed;
      width: 30px;
      height: 30px;
      top: 20px;
      right: 20px;
      font-size: 20px;
      cursor: pointer;
      background-color: red;
      border-radius: 10px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #audioPlayer {
      display: none;
      position: relative;
      margin-top: 10px;
      padding: 10px 10px;
      background: rgba(40, 40, 0, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.5s ease;
    }

    #audioPlayer button {
      background: #ddd;
      backdrop-filter: blur(5px);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
    }

    #audioPlayer input[type="range"] {
      flex-grow: 1;
      height: 6px;
      border-radius: 5px;
      background: #ddd;
      appearance: none;
      cursor: pointer;
    }

    #audioPlayer input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #333;
      cursor: pointer;
    }





  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="infoCard">
    <div id="infoCardContent">
      <span id="closeBtn">&times;</span>
      <h2 id="infoTitle"></h2>
      <img id="infoImage" src="" alt="info" style="max-width: 100%; margin-bottom: 15px; border-radius: 8px;" />
      <div id="audioPlayer">
        <button id="playPauseBtn">⏵︎</button>
        <input type="range" id="progressBar" value="0" min="0" step="1" />
        <audio id="audio" src=""></audio>
      </div>

      <p id="infoText"></p>


    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    let scene, camera, renderer;
    let yawObject, pitchObject;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let clickableObjects = [];

    let isMouseDown = false;
    let isTouching = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    let prevTouchX = 0;
    let prevTouchY = 0;
    let mouseMoved = false;
    const clickThreshold = 5;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      pitchObject = new THREE.Object3D();
      pitchObject.add(camera);

      yawObject = new THREE.Object3D();
      yawObject.position.y = 1.5;
      yawObject.add(pitchObject);

      scene.add(yawObject);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(10, 10, 10);
      scene.add(light);

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);
      loader.load('assets/Stanza-scansionata-1.glb', (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        scene.add(model);
      });

      addInteractivePoint(new THREE.Vector3(1.7, 1.7, 0), '#ff0000', 'ROSSO');
      addInteractivePoint(new THREE.Vector3(-1.7, 0.9, -1), '#00ff00', 'VERDE');
      addInteractivePoint(new THREE.Vector3(-1.7, 1.2, 1), '#0000ff', 'BLU');

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Mouse events
      window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        mouseMoved = false;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const deltaX = e.clientX - prevMouseX;
        const deltaY = e.clientY - prevMouseY;

        if (Math.abs(deltaX) > clickThreshold || Math.abs(deltaY) > clickThreshold) {
          mouseMoved = true;
        }

        yawObject.rotation.y -= deltaX * 0.002;
        pitchObject.rotation.x -= deltaY * 0.002;
        pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));

        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mouseup', (e) => {
        isMouseDown = false;
        if (!mouseMoved) {
          handlePointerSelect(e.clientX, e.clientY);
        }
      });

      // Touch events
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isTouching = true;
          mouseMoved = false;
          prevTouchX = e.touches[0].clientX;
          prevTouchY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isTouching || e.touches.length !== 1) return;

        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;
        const deltaX = touchX - prevTouchX;
        const deltaY = touchY - prevTouchY;

        if (Math.abs(deltaX) > clickThreshold || Math.abs(deltaY) > clickThreshold) {
          mouseMoved = true;
        }

        yawObject.rotation.y -= deltaX * 0.002;
        pitchObject.rotation.x -= deltaY * 0.002;
        pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));

        prevTouchX = touchX;
        prevTouchY = touchY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        isTouching = false;
        if (!mouseMoved && e.changedTouches.length === 1) {
          const touch = e.changedTouches[0];
          handlePointerSelect(touch.clientX, touch.clientY);
        }
      }, { passive: true });
    }

    function createLabelSprite(text, color = '#00FFAA') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.beginPath();
      ctx.arc(128, 128, 20, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 25;
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(1, 1, 1);
      return sprite;
    }

    function addInteractivePoint(position, color, name) {
      const sprite = createLabelSprite(name, color);
      sprite.position.copy(position);
      sprite.name = name;
      scene.add(sprite);
      clickableObjects.push(sprite);
    }

    function handlePointerSelect(x, y) {
      mouse.x = (x / window.innerWidth) * 2 - 1;
      mouse.y = -(y / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableObjects);

      if (intersects.length > 0) {
        const clickedName = intersects[0].object.name;
        showInfoCard(clickedName);
      }
    }

    function showInfoCard(name) {
      const infoCard = document.getElementById('infoCard');
      const title = document.getElementById('infoTitle');
      const text = document.getElementById('infoText');
      const image = document.getElementById('infoImage');
      const audio = document.getElementById('audio');
      const audioPlayer = document.getElementById('audioPlayer');

      const data = {
        'ROSSO': {
          title: 'Gli Affreschi: La Mano di Teodoro Ghisi',
          text: 'Il pregio maggiore dell\'Oratorio risiede negli affreschi che ne decorano la volta absidale. Le fonti attribuiscono queste pitture a Teodoro Ghisi (circa 1536-1601), un importante artista mantovano formatosi alla scuola di Giulio Romano e attivo presso la corte dei Gonzaga. Questa attribuzione colloca gli affreschi nel pieno manierismo tardo cinquecentesco.',
          image: 'assets/schede/1.jpg',
          audio: 'assets/schede/Fairy_Vibes.mp3'
        },
        'VERDE': {
          title: 'Un Balconcino e Drastiche Trasformazioni',
          text: 'Originariamente, un dettaglio architettonico significativo era un balconcino che, da una stanza adiacente (probabilmente una camera padronale), permetteva ai Signori di assistere alle funzioni religiose in modo riservato. Tuttavia, la storia dell\'Oratorio è segnata da un cambiamento radicale: in epoca successiva, probabilmente all\'inizio del XX secolo, una parte consistente dell\'antica cappella fu trasformata in un locale bagno, adiacente alla "Camera del Re" approntata per Vittorio Emanuele III nel 1909.',
          image: 'assets/schede/2.png',
          audio: 'assets/schede/Fairy_Vibes.mp3'
        },
        'BLU': {
          title: 'Iconografia degli Affreschi: Un Mistero da Svelare',
          text: 'Nonostante l\'attribuzione a Ghisi, i soggetti precisi degli affreschi rimangono in parte oscuri. La denominazione "Oratorio della Natività di Maria" suggerisce che il ciclo potesse illustrare episodi della vita della Vergine. Si ipotizzano scene come la "Trinità che incorona Maria" o l\'"Annunciazione", ma mancano conferme visive o descrizioni dettagliate che ne attestino con certezza l\'iconografia. Lo stile sarebbe tipicamente manierista, con figure dinamiche e complesse, forse influenzato dalle esigenze devozionali della Controriforma.',
          image: 'assets/schede/3.jpg',
          audio: 'assets/schede/Fairy_Vibes.mp3'
        }
      };

      if (data[name]) {
        title.innerText = data[name].title;
        text.innerText = data[name].text;
        image.src = data[name].image;
        audio.src = data[name].audio;
        audioPlayer.style.display = 'flex';
        infoCard.classList.add('show');
      }
    }

    document.getElementById('closeBtn').addEventListener('click', () => {
      const audio = document.getElementById('audio');
      const playPauseBtn = document.getElementById('playPauseBtn');
      const audioPlayer = document.getElementById('audioPlayer');

      audio.pause();
      audio.currentTime = 0;
      playPauseBtn.textContent = '⏵︎';
      audioPlayer.style.display = 'none';

      document.getElementById('infoCard').classList.remove('show');
    });


    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressBar = document.getElementById('progressBar');

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playPauseBtn.textContent = '⏸︎';
      } else {
        audio.pause();
        playPauseBtn.textContent = '⏵︎';
      }
    });

    // Aggiorna la barra mentre l'audio avanza
    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        progressBar.max = Math.floor(audio.duration);
        progressBar.value = Math.floor(audio.currentTime);
      }
    });

    // Quando l'utente muove la barra, cambia il tempo dell'audio
    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });

    // Gestione del giroscopio
    function handleOrientation(event) {
        // Normalizza i valori per Three.js
        const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
        const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
        const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
        
        // Applica la rotazione all'oggetto
        cube.rotation.set(beta, alpha, -gamma);
    }

    // Richiedi permesso su iOS 13+
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.addEventListener('click', function() {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                })
                .catch(console.error);
        });
    } else {
        window.addEventListener('deviceorientation', handleOrientation);
    }

    // Animazione
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();





    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
