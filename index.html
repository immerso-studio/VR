<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Portal Room - Real Window Effect</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    let camera, renderer;
    let sceneA, sceneB, activeScene;
    let portalMesh;
    let switched = false;
    let renderTarget;

    init();
    animate();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.6, 3);

      // Scene A
      sceneA = new THREE.Scene();
      sceneA.background = new THREE.Color(0x222222);
      addLights(sceneA);
      loadRoom(sceneA);

      // Scene B (ambiente alternativo)
      sceneB = new THREE.Scene();
      sceneB.background = new THREE.Color(0x003366);
      addLights(sceneB);
      const altRoom = new THREE.Mesh(
        new THREE.BoxGeometry(10, 2.5, 10),
        new THREE.MeshStandardMaterial({ color: 0x225577, side: THREE.BackSide })
      );
      sceneB.add(altRoom);

      // Render Target
      renderTarget = new THREE.WebGLRenderTarget(512, 512);

      // Portale - mostra già il mondo alternativo
      const portalGeo = new THREE.PlaneGeometry(1, 2);
      const portalMat = new THREE.MeshBasicMaterial({ map: renderTarget.texture });
      portalMesh = new THREE.Mesh(portalGeo, portalMat);
      portalMesh.position.set(0, 1.6, -1.5);
      sceneA.add(portalMesh);

      activeScene = sceneA;

      window.addEventListener('resize', onWindowResize);
    }

    function addLights(scene) {
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
      hemi.position.set(0, 1, 0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(3, 10, 10);
      scene.add(dir);
    }

    function loadRoom(scene) {
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/Stanza-prova-1.glb', function (gltf) {
        gltf.scene.scale.set(1, 1, 1);
        scene.add(gltf.scene);
      }, undefined, function (error) {
        console.error('Errore nel caricamento GLB:', error);
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        updatePortalView();
        checkPortalEntry();
        renderer.render(activeScene, camera);
      });
    }

    function updatePortalView() {
      // Renderizziamo sceneB dentro il renderTarget
      renderer.setRenderTarget(renderTarget);
      renderer.render(sceneB, camera);
      renderer.setRenderTarget(null); // ritorna al rendering standard
    }

    function checkPortalEntry() {
      if (switched) return;

      const camPos = new THREE.Vector3();
      camera.getWorldPosition(camPos);

      const portalPos = portalMesh.position.clone();
      const distance = camPos.distanceTo(portalPos);

      if (distance < 0.5) {
        console.log("✅ PORTALE ATTRAVERSATO");
        switched = true;
        activeScene = sceneB;
      }
    }
  </script>
</body>
</html>
