<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Scroll Camera Path - Visualizzazione Mobile Ottimizzata</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    :root {
      --marker-size: 60px;
    }
    body { 
      margin: 0; 
      overflow: hidden;
      touch-action: none; /* Previene lo scroll nativo del browser */
      -webkit-overflow-scrolling: touch;
    }
    canvas { 
      display: block; 
      width: 100% !important;
      height: 100% !important;
    }

    .marker {
      position: absolute;
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      pointer-events: auto;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.4s ease, background-color 0.4s ease, border 0.4s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    #marker1 {
      background: rgba(255, 255, 255, 0.3); /* leggermente trasparente */
      backdrop-filter: blur(3px) saturate(180%); /* effetto vetro smerigliato */
      -webkit-backdrop-filter: blur(12px) saturate(180%); /* supporto Safari */
      border: 3px solid rgba(178, 178, 178, 0.3);
      border-radius: 5px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }
    #marker1:hover {
      color: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.8);
      transform: scale(1.05);
    }

    #marker2 {
      background: rgba(255, 255, 255, 0.3); /* leggermente trasparente */
      backdrop-filter: blur(3px) saturate(180%); /* effetto vetro smerigliato */
      -webkit-backdrop-filter: blur(12px) saturate(180%); /* supporto Safari */
      border: 3px solid rgba(178, 178, 178, 0.3);
      border-radius: 5px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }
    #marker2:hover {
      color: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.8);
      transform: scale(1.05);
    }

    /* Modal personalizzata per i marker */
    .marker-modal .modal-dialog {
      max-width: 40%;
      margin: 1.75rem auto;
    }
    
    /* MODIFICA: Posizionamento a sinistra per desktop */
    @media (min-width: 992px) {
      .marker-modal .modal-dialog {
        margin: 1.75rem 0 1.75rem 1.75rem;
        max-width: 500px;
        position: fixed;
        left: 0;
        top: 0;
        transform: none !important;
      }
    }
    
    .marker-modal .modal-content {
      background: rgba(0, 0, 0, 0.5); /* leggermente trasparente */
      backdrop-filter: blur(50px) saturate(100%); /* effetto vetro smerigliato */
      -webkit-backdrop-filter: blur(12px) saturate(180%); /* supporto Safari */
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 1px;
      box-shadow: 0 0px 80px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      max-height: 95vh;
      overflow-y: auto;
    }

    .marker-modal .btn-close {
      filter: invert(1);
    }
        
    /* Header con vetro scuro */
    .marker-modal .modal-header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 1px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* Menu snap points */
    #snap-menu {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 100;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      justify-content: center;
      transition: all 0.5s ease;
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
      max-width: 90%;
    }
    
    #snap-menu::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Edge */
    }
    
    .snap-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 500;
      flex-shrink: 0;
      filter: blur(1.5px);
      opacity: 0.7;
    }
    
    .snap-btn.active {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      filter: blur(0);
      opacity: 1;
      transform: scale(1.1);
      z-index: 2;
    }
    
    .snap-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    
    /* Per dispositivi mobili */
    @media (max-width: 991px) {
      .marker-modal .modal-dialog {
        max-width: 95%;
        margin: 30px auto;
      }
      
      .marker {
        width: 50px;
        height: 50px;
        font-size: 18px;
      }
      
      body {
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      
      #snap-menu {
        padding: 8px 15px;
        max-width: 85%;
      }
      
      .snap-btn {
        padding: 6px 12px;
        font-size: 14px;
        filter: blur(1px);
      }
    }
    
    /* Loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      color: white;
      font-family: Arial, sans-serif;
    }
    
    .progress {
      width: 80%;
      max-width: 500px;
      margin-top: 20px;
      height: 5px;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(10px);      
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9998;
      flex-direction: column;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #startScreen.show {
      visibility: visible;
      opacity: 1;
    }

    #startButton {
      background: rgba(255, 255, 255, 0.15); /* leggermente trasparente */
      backdrop-filter: blur(12px) saturate(180%); /* effetto vetro smerigliato */
      -webkit-backdrop-filter: blur(12px) saturate(180%); /* supporto Safari */
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }

    #startButton:hover {
      color: #ffffff;
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    .logo {
      max-width: 230px;
      height: auto;
      position: fixed;
      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.2));
      margin-top: 600px;
    }

    .logoText {
      position: fixed;
      font-size: 0.8rem;
      margin-top: 500px;
      color: #8f8f8f;
      font-family: Helvetica;
    }
        

  </style>
</head>
<body>

<div id="loading">
  <div class="progress">
    <div class="progress-bar progress-bar-animated" role="progressbar" style="width: 0%"></div>
  </div>
</div>

<!-- Schermata Start -->
<div id="startScreen">

  <p class="logoText">Created by:</p>

</div>

<!-- Menu Snap Points -->
<div id="snap-menu">
  <button class="snap-btn" data-snap="0.001">1. Cucina</button>
  <button class="snap-btn" data-snap="0.35">2. Salotto</button>
  <button class="snap-btn" data-snap="0.5">3. Sala</button>
</div>

<!-- MARKER UI -->
<div id="marker1" class="marker" aria-label="Apri Dettagli 1" title="Apri Dettagli 1"><b>+</b></div>
<div id="marker2" class="marker" aria-label="Apri Dettagli 2" title="Apri Dettagli 2"><b>+</b></div>

<!-- Modale per i marker -->
<div class="modal fade marker-modal" id="markerModal" tabindex="-1" aria-labelledby="markerModalLabel" aria-hidden="true" data-bs-backdrop="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="markerModalLabel">Titolo Marker</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Contenuto del marker...
      </div>

    </div>
  </div>
</div>

<!-- Import map Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "GLTFLoader": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
    "DRACOLoader": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js"
  }
}
</script>

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<!-- Bootstrap 5 JS (bundle include Popper) -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"
></script>

<!-- App -->
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "GLTFLoader";
import { DRACOLoader } from "DRACOLoader";

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Impostazioni per mobile
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
const baseFOV = isMobile ? 40 : 35; // FOV leggermente più ampio su mobile

const camera = new THREE.PerspectiveCamera(baseFOV, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 3);

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

let mixer, action, dummyCamera;
let targetScrollValue = 0;
let currentScrollValue = 0;
const scrollSensitivity = isMobile ? 0.0004 : 0.0002; // Sensibilità maggiore su mobile
const smoothFactor = 0.009;

// SNAP POINTS
const snapPoints = [0.001, 0.35, 0.5]; // valori normalizzati
const snapThreshold = 0.02;

// Variabili per il controllo del touch
let touchStartY = 0;
let isScrolling = false;

// Variabili per l'animazione del marker1
let hoodMixer = null;
let hoodAction = null;
let isHoodAnimationPlaying = false;
let hoodAnimationDuration = 0;
let isHoodAnimationReversing = false;

// Variabile per tenere traccia dello stato dei marker (visibile/nascosto per click)
const markerVisibilityState = {};

// Variabile per distinguere scroll vs menu
let isSnappingFromMenu = false;

// Funzione per aggiornare la barra di progresso
function updateProgress(progress) {
  const progressBar = document.querySelector('.progress-bar');
  progressBar.style.width = `${progress}%`;
}

// 🔹 Stato caricamento dei GLB
let povLoaded = false;
let cameraPathLoaded = false;

function tryHideLoader() {
  if (povLoaded && cameraPathLoaded) {
    updateProgress(100);
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      // Mostra la schermata START
      document.getElementById('startScreen').classList.add('show');
    }, 500);
  }
}

document.getElementById("startButton").addEventListener("click", () => {
  document.getElementById("startScreen").classList.remove("show");
  // Avvia l'animazione
  animate();
});

// Carico la scena principale
loader.load("./assets/DEMO/ff_pov.glb", (gltf) => {
  scene.add(gltf.scene);
  gltf.scene.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  
  // Cerca l'animazione specifica per il marker1
  const hoodClip = THREE.AnimationClip.findByName(gltf.animations, "ff_split-001_hood-001Action");
  if (hoodClip) {
    hoodMixer = new THREE.AnimationMixer(gltf.scene);
    hoodAction = hoodMixer.clipAction(hoodClip);
    hoodAnimationDuration = hoodClip.duration;
    hoodAction.setLoop(THREE.LoopOnce);
    hoodAction.clampWhenFinished = true;
    hoodAction.paused = true; // Inizia in pausa
  }
  
  updateProgress(50);
  povLoaded = true;
  tryHideLoader();
}, undefined, (error) => {
  console.error("Errore nel caricamento del modello:", error);
});

// Carico il percorso camera
loader.load("./assets/DEMO/camera_paths.glb", (gltf) => {
  scene.add(gltf.scene);
  mixer = new THREE.AnimationMixer(gltf.scene);
  const clip = THREE.AnimationClip.findByName(gltf.animations, "ff_empty_action");
  if (clip) {
    action = mixer.clipAction(clip);
    action.play();
  }
  dummyCamera = gltf.scene.getObjectByName("ff_empty");
  cameraPathLoaded = true;
  tryHideLoader();
}, undefined, (error) => {
  console.error("Errore nel caricamento del percorso camera:", error);
});

// LUCI
scene.add(new THREE.AmbientLight(0xffffff, 2));
const fillLight = new THREE.DirectionalLight(0xffffff, 1);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffaa33, 1);
rimLight.position.set(-3, 2, 3);
scene.add(rimLight);

let isModalOpen = false;
let currentMarkerId = null;

// Quando la modale si apre
document.getElementById('markerModal').addEventListener('show.bs.modal', () => {
  isModalOpen = true;
});

// Quando la modale si chiude
document.getElementById('markerModal').addEventListener('hidden.bs.modal', () => {
  isModalOpen = false;
  
  // Ripristina la visibilità del marker con un fade in
  if (currentMarkerId) {
    const markerElement = document.getElementById(currentMarkerId);
    markerVisibilityState[currentMarkerId] = true;
    
    // Forza un aggiornamento della posizione del marker
    const markerData = markers.find(m => m.id === currentMarkerId);
    if (markerData) {
      updateMarker(markerData);
    }
    
    // Animazione di fade in
    gsap.fromTo(markerElement,
      { opacity: 0 },
      { opacity: 1, duration: 0.5, ease: "power1.out" }
    );
  }
  
  // Se l'animazione del marker1 è attiva, farla andare in reverse
  if (currentMarkerId === "marker1" && hoodAction && isHoodAnimationPlaying) {
    isHoodAnimationReversing = true;
    hoodAction.paused = false;
    hoodAction.timeScale = -1;
    hoodAction.play();
  }
  
  currentMarkerId = null;
});

// CONTROLLO SCROLL - Mouse
window.addEventListener("wheel", (event) => {
  if (isModalOpen) return; // blocca il controllo camera se la modale è aperta

  const isMouseScroll = Math.abs(event.deltaY) % 120 === 0;
  const sensitivity = isMouseScroll ? scrollSensitivity * 0.5 : scrollSensitivity;
  targetScrollValue += event.deltaY * sensitivity;
  targetScrollValue = Math.max(0, Math.min(1, targetScrollValue));
  event.preventDefault();
}, { passive: false });

// CONTROLLO SCROLL - Touch
window.addEventListener('touchstart', (event) => {
  if (isModalOpen) return; 
  touchStartY = event.touches[0].clientY;
  isScrolling = true;
}, { passive: true });

window.addEventListener('touchmove', (event) => {
  if (isModalOpen) return;
  if (!isScrolling) return;

  const touchY = event.touches[0].clientY;
  const deltaY = touchStartY - touchY;
  touchStartY = touchY;

  targetScrollValue += deltaY * scrollSensitivity * 2;
  targetScrollValue = Math.max(0, Math.min(1, targetScrollValue));

  event.preventDefault();
}, { passive: false });

window.addEventListener('touchend', () => {
  if (isModalOpen) return;
  isScrolling = false;
});

// Prevenire il comportamento di scroll nativo
document.addEventListener('touchmove', (e) => {
  if (e.target.tagName !== 'CANVAS') return;
  e.preventDefault();
}, { passive: false });

// === DEFINIZIONE DEI MARKER ===
const markers = [
  {
    id: "marker1",
    position: new THREE.Vector3(-8, 1.3, -5),
    fadeInStart: 0,
    fullyVisible: 0,
    fadeOutStart: 0.05,
    fadeOutEnd: 0.051,
    title: "BLACK DIAMOND",
    content: `
      <p>I momenti di socialità e incontro, sia per motivi professionali che personali, sono sempre più frequenti e per questo si è esigenti nei confronti degli spazi ospitanti. Gli si chiede di essere accoglienti, eleganti, funzionali. Ecco allora che la scelta di un materiale come Black Diamond diventa fondamentale per la definizione degli stessi. 
        <br><br>Ricercatezza e carattere sembrano le parole chiave per creare la base su cui inserire complementi confortevoli e originali al tempo stesso, in modo da regalare un senso di intimità quasi domestico.</p>
      <img src="./assets/DEMO/3.jpg" class="img-fluid shadow" alt="Immagine Marker 1">
      <p><br>Model No.18 è un divano rivestito in tessuto. Nella progettazione del divano il team Hannabi ha tenuto conto non solo 
        delle funzioni base che solitamente determinano il design ergonomico di un divano, 
        ma hanno anche creato un modello multifunzionale da poter vivere nel massimo comfort, 
        dal riposo pomeridiano al lavoro, grazie agli angoli dalla forma morbida, alle dimensioni 
        ottimali del bracciolo e dello schienale e agli accessori.</p>

    `
  },
  {
    id: "marker2",
    position: new THREE.Vector3(-7, 1.3, 4),
    fadeInStart: 0.28,
    fullyVisible: 0.281,
    fadeOutStart: 0.38,
    fadeOutEnd: 0.381,
    title: "DIVANO",
    content: `
      <p>Model No.18 è un divano rivestito in tessuto. Nella progettazione del divano il team Hannabi ha tenuto conto non solo 
        delle funzioni base che solitamente determinano il design ergonomico di un divano, 
        ma hanno anche creato un modello multifunzionale da poter vivere nel massimo comfort, 
        dal riposo pomeridiano al lavoro, grazie agli angoli dalla forma morbida, alle dimensioni 
        ottimali del bracciolo e dello schienale e agli accessori. Il peso del modello è stato progettato 
        in modo tale che la stabilità non richieda il collegamento degli elementi, quindi in occasioni speciali, 
        gli elementi possono essere riorganizzati quando si ricevono ospiti.</p>
      <img src="./assets/DEMO/2.webp" class="img-fluid shadow" alt="Immagine Marker 1">
        <p><br>Un ripiano posizionabile sullo schienale che funge da tavolino per la colazione o per el computer sulle ginocchia. Una vasta scelta di cuscini. Pouf individuali.</p>
    `
  },
];

// Inizializza la modale di Bootstrap
const markerModal = new bootstrap.Modal(document.getElementById('markerModal'));

// Funzione per mostrare la modale
function showModal(title, content) {
  const targetFOV = Math.max(25, baseFOV - 5);
  gsap.to(camera, { 
    fov: targetFOV, 
    duration: 0.8, 
    ease: "power2.inOut", 
    onUpdate: () => camera.updateProjectionMatrix() 
  });
  
  document.getElementById('markerModalLabel').textContent = title;
  const modalBody = document.querySelector('.modal-body');
  modalBody.innerHTML = content;
  
  const children = modalBody.children;
  gsap.set(children, { opacity: 0, y: 20 });
  
  markerModal.show();
  
  const tl = gsap.timeline({ delay: 0.2 });
  tl.to(children, {
    opacity: 1,
    y: 0,
    duration: 0.4,
    stagger: 0.2,
    ease: "power2.out"
  });
  
  document.getElementById('markerModal').addEventListener('hidden.bs.modal', function () {
    gsap.to(camera, { 
      fov: baseFOV, 
      duration: 0.8, 
      ease: "power2.inOut", 
      onUpdate: () => camera.updateProjectionMatrix() 
    });
  }, {once: true});
}

// Funzione per aggiornare un singolo marker
function updateMarker(markerData) {
  const markerElement = document.getElementById(markerData.id);

  if (markerVisibilityState[markerData.id] === false) {
    markerElement.style.opacity = 0;
    markerElement.style.pointerEvents = "none";
    return;
  }

  let opacity = 0;
  if (currentScrollValue >= markerData.fadeInStart && currentScrollValue <= markerData.fullyVisible) {
    opacity = (currentScrollValue - markerData.fadeInStart) / Math.max(0.000001, (markerData.fullyVisible - markerData.fadeInStart));
  } else if (currentScrollValue > markerData.fullyVisible && currentScrollValue < markerData.fadeOutStart) {
    opacity = 1;
  } else if (currentScrollValue >= markerData.fadeOutStart && currentScrollValue <= markerData.fadeOutEnd) {
    opacity = 1 - (currentScrollValue - markerData.fadeOutStart) / Math.max(0.000001, (markerData.fadeOutEnd - markerData.fadeOutStart));
  }

  const vector = markerData.position.clone();
  vector.project(camera);
  const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
  markerElement.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;

  const inViewport = (vector.z < 1 && vector.x > -1 && vector.x < 1 && vector.y > -1 && vector.y < 1);
  markerElement.style.opacity = inViewport ? opacity : 0;
  markerElement.style.pointerEvents = (inViewport && opacity > 0.6) ? "auto" : "none";
}

// Click handler per i marker
markers.forEach(marker => {
  const markerElement = document.getElementById(marker.id);
  markerVisibilityState[marker.id] = true;
  
  markerElement.addEventListener("click", () => {
    gsap.to(markerElement, {
      opacity: 0,
      duration: 0.3,
      ease: "power1.out",
      onComplete: () => {
        markerVisibilityState[marker.id] = false;
      }
    });

    gsap.fromTo(markerElement, 
      { scale: 1 }, 
      { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }
    );

    if (marker.id === "marker1" && hoodAction) {
      hoodAction.reset();
      hoodAction.timeScale = 1;
      hoodAction.paused = false;
      hoodAction.play();
      isHoodAnimationPlaying = true;
      isHoodAnimationReversing = false;
    }

    currentMarkerId = marker.id;
    showModal(marker.title, marker.content);
  });
});

// Funzione per centrare il pulsante attivo
function centerActiveSnapButton() {
  const activeButton = document.querySelector('.snap-btn.active');
  const menu = document.getElementById('snap-menu');
  
  if (activeButton) {
    const menuRect = menu.getBoundingClientRect();
    const buttonRect = activeButton.getBoundingClientRect();
    const offset = buttonRect.left - menuRect.left - (menuRect.width / 2) + (buttonRect.width / 2);
    menu.scrollTo({ left: menu.scrollLeft + offset, behavior: 'smooth' });
  }
}

// Aggiorna il menu snap
function updateSnapMenu() {
  const buttons = document.querySelectorAll('.snap-btn');
  let activeFound = false;
  
  buttons.forEach(button => {
    const snapValue = parseFloat(button.dataset.snap);
    const isActive = Math.abs(currentScrollValue - snapValue) < snapThreshold;
    if (isActive) {
      button.classList.add('active');
      activeFound = true;
    } else {
      button.classList.remove('active');
    }
  });
  
  if (activeFound) {
    setTimeout(centerActiveSnapButton, 50);
  }
}

// Event listener per pulsanti snap
document.querySelectorAll('.snap-btn').forEach(button => {
  button.addEventListener('click', () => {
    const snapValue = parseFloat(button.dataset.snap);
    targetScrollValue = snapValue;
    isSnappingFromMenu = true; // 🔹 segno che arrivo da menu
    
    button.classList.add('active');
    setTimeout(centerActiveSnapButton, 50);
  });
});

// ANIMATE
function animate() {
  requestAnimationFrame(animate);

  const diff = targetScrollValue - currentScrollValue;
  currentScrollValue += diff * smoothFactor;

  // Snap logic SOLO se non arrivo da menu
  if (!isSnappingFromMenu) {
    for (let snap of snapPoints) {
      if (Math.abs(currentScrollValue - snap) < snapThreshold) {
        targetScrollValue = THREE.MathUtils.lerp(targetScrollValue, snap, 0.02);
      }
    }
  }

  // Se arrivo da menu ed ho praticamente raggiunto la destinazione
  if (isSnappingFromMenu && Math.abs(currentScrollValue - targetScrollValue) < 0.0002) {
    currentScrollValue = targetScrollValue; 
    isSnappingFromMenu = false; 
  }

  if (mixer && action) {
    let duration = action.getClip().duration;
    mixer.setTime(currentScrollValue * duration);
    if (dummyCamera) {
      camera.position.copy(dummyCamera.position);
      camera.quaternion.copy(dummyCamera.quaternion);
    }
  }
  
  if (hoodMixer) {
    const delta = 0.016;
    hoodMixer.update(delta);
    if (isHoodAnimationPlaying && !isHoodAnimationReversing && hoodAction.time >= hoodAnimationDuration) {
      hoodAction.paused = true;
    }
    if (isHoodAnimationReversing && hoodAction.time <= 0) {
      hoodAction.paused = true;
      isHoodAnimationPlaying = false;
      isHoodAnimationReversing = false;
    }
  }

  markers.forEach(updateMarker);
  updateSnapMenu();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Previeni doppio tap zoom
let lastTap = 0;
document.addEventListener('touchend', function(event) {
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTap;
  if (tapLength < 300 && tapLength > 0) {
    event.preventDefault();
  }
  lastTap = currentTime;
}, false);

// Previeni menu contestuale
document.addEventListener('contextmenu', event => event.preventDefault());
</script>
