<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js VR Portal with Scene Preview</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
    import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/webxr/VRButton.js';

    let camera, sceneA, sceneB, renderer;
    let portalMesh, portalCamera, portalTexture;
    let inSceneB = false;
    let lastSide = null;

    init();
    animate();

    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.autoClear = false; // Important for render-to-texture
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(VRButton.createButton(renderer));

      // Camera
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 0);

      // Scene A
      sceneA = new THREE.Scene();
      sceneA.background = new THREE.Color('blue');

      // Red cubes
      const cubeGeometry = new THREE.BoxGeometry();
      const cubeMaterial = new THREE.MeshBasicMaterial({ color: 'red' });
      for (let i = 0; i < 3; i++) {
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(i * 2 - 2, 1, -1);
        sceneA.add(cube);
      }

      // Scene B
      sceneB = new THREE.Scene();
      sceneB.background = new THREE.Color('yellow');

      // Green spheres
      const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
      const sphereMaterial = new THREE.MeshBasicMaterial({ color: 'green' });
      for (let i = 0; i < 3; i++) {
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(i * 2 - 2, 1, -1);
        sceneB.add(sphere);
      }

      // Portal render target
      portalTexture = new THREE.WebGLRenderTarget(512, 512);

      // Portal camera (aligned with portalMesh later)
      portalCamera = new THREE.PerspectiveCamera(70, 1, 0.1, 100);

      // Portal mesh with SceneB texture
      const portalGeometry = new THREE.CircleGeometry(1, 64);
      const portalMaterial = new THREE.MeshBasicMaterial({
        map: portalTexture.texture,
        side: THREE.DoubleSide,
      });
      portalMesh = new THREE.Mesh(portalGeometry, portalMaterial);
      portalMesh.position.set(0, 1.6, -1);
      portalMesh.rotation.y = Math.PI;
      sceneA.add(portalMesh);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      // --- Portal crossing logic ---
      const portalNormal = new THREE.Vector3(0, 0, 1).applyQuaternion(portalMesh.quaternion);
      const portalPosition = portalMesh.position;
      const camToPortal = new THREE.Vector3().subVectors(camera.position, portalPosition);
      const distance = portalNormal.dot(camToPortal);
      const currentSide = distance > 0 ? 1 : -1;

      if (lastSide !== null && currentSide !== lastSide) {
        inSceneB = !inSceneB;
      }
      lastSide = currentSide;

      // --- Update portal camera to mimic user view from the other side ---
      portalCamera.position.copy(camera.position);
      portalCamera.quaternion.copy(camera.quaternion);

      // Mirror camera across portal plane
      const portalWorldMatrix = new THREE.Matrix4().copy(portalMesh.matrixWorld);
      const portalNormalWorld = new THREE.Vector3(0, 0, 1).applyMatrix4(new THREE.Matrix3().getNormalMatrix(portalWorldMatrix));
      const portalPoint = portalMesh.getWorldPosition(new THREE.Vector3());

      const camPos = camera.getWorldPosition(new THREE.Vector3());
      const toPlane = new THREE.Vector3().subVectors(camPos, portalPoint);
      const distanceToPlane = toPlane.dot(portalNormalWorld);
      const mirroredPos = camPos.clone().sub(portalNormalWorld.clone().multiplyScalar(2 * distanceToPlane));
      portalCamera.position.copy(mirroredPos);

      // Flip orientation
      const mirrorMatrix = new THREE.Matrix4().makeScale(-1, 1, 1);
      portalCamera.quaternion.copy(camera.quaternion);
      portalCamera.applyMatrix4(mirrorMatrix);

      portalCamera.updateMatrixWorld();
      portalCamera.updateProjectionMatrix();

      // --- Render Scene B to portal texture ---
      renderer.setRenderTarget(portalTexture);
      renderer.clear();
      renderer.render(sceneB, portalCamera);
      renderer.setRenderTarget(null);

      // --- Render current scene to screen ---
      renderer.clear();
      if (inSceneB) {
        renderer.render(sceneB, camera);
      } else {
        renderer.render(sceneA, camera);
      }
    }
  </script>
</body>
</html>
