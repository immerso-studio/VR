
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Particelle Animate e Interattive</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    .hotspot {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(0, 255, 0, 0.7);
      border: 2px solid white;
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hotspot" class="hotspot" style="display:none"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

    let scene, camera, renderer, controls;
    let particles, particlePositions, originalPositions;
    let mouse = new THREE.Vector2();
    let raycaster = new THREE.Raycaster();
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersectPoint = new THREE.Vector3();

    const animatedIndices = new Set();
    const animationParams = [];

    const hotspot = document.getElementById('hotspot');
    const hotspotTarget = new THREE.Vector3(1, 1, 0); // posizione del punto interattivo

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(10, 10, 10);
      scene.add(light);

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);
      loader.load('assets/Stanza-scansionata-1.glb', (gltf) => {
        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = camera.fov * (Math.PI / 180);
        const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
        camera.position.set(0, 0, cameraZ);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
        controls.update();

        convertGeometryToParticles(model);
      });

      hotspot.addEventListener('click', () => {
        alert('Hai cliccato sul punto interattivo!');
      });

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
    }

    function convertGeometryToParticles(model) {
      const geometries = [];
      const colors = [];

      model.traverse((child) => {
        if (child.isMesh && child.geometry && child.material && child.material.map) {
          const geom = child.geometry.clone();
          const uvAttr = geom.attributes.uv;
          const posAttr = geom.attributes.position;
          if (!uvAttr || !posAttr) return;

          const texture = child.material.map;
          const image = texture.image;
          if (!image) return;

          const canvas = document.createElement('canvas');
          canvas.width = image.width;
          canvas.height = image.height;
          const context = canvas.getContext('2d');
          context.drawImage(image, 0, 0);
          const imageData = context.getImageData(0, 0, image.width, image.height).data;

          for (let i = 0; i < uvAttr.count; i++) {
            const u = uvAttr.getX(i);
            const v = uvAttr.getY(i);
            const x = Math.floor(u * image.width);
            const y = Math.floor((1 - v) * image.height);
            const index = (y * image.width + x) * 4;
            const r = imageData[index] / 255;
            const g = imageData[index + 1] / 255;
            const b = imageData[index + 2] / 255;
            colors.push(r, g, b);
          }

          child.updateWorldMatrix(true, false);
          geom.applyMatrix4(child.matrixWorld);
          geometries.push(geom);
        }
      });

      if (geometries.length === 0) return;

      const mergedGeometry = BufferGeometryUtils.mergeBufferGeometries(geometries, false);
      const positions = mergedGeometry.attributes.position.array;
      originalPositions = new Float32Array(positions.length);
      for (let i = 0; i < positions.length; i++) {
        const offset = (Math.random() - 0.5) * 0.02;
        originalPositions[i] = positions[i] + offset;
      }

      for (let i = 0; i < positions.length; i += 3) {
        if (Math.random() < 0.1) {
          animatedIndices.add(i);
          animationParams.push({
            index: i,
            axis: Math.floor(Math.random() * 3),
            amplitude: 0.02 + Math.random() * 0.02,
            speed: 0.5 + Math.random(),
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(originalPositions.slice(), 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      function createCircleTexture(size = 64) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const center = size / 2;
        ctx.beginPath();
        ctx.arc(center, center, size / 2, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        const texture = new THREE.Texture(canvas);
        texture.needsUpdate = true;
        return texture;
      }

      const material = new THREE.PointsMaterial({
        size: 0.01,
        vertexColors: true,
        map: createCircleTexture(),
        alphaTest: 0.5,
        transparent: false,
        depthWrite: true,
        sizeAttenuation: true
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);
      particlePositions = geometry.attributes.position;
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      const t = time * 0.001;

      if (particles) {
        raycaster.setFromCamera(mouse, camera);
        intersectPoint.copy(raycaster.ray.origin).add(raycaster.ray.direction.clone().multiplyScalar(5));

        const positions = particlePositions.array;
        for (let i = 0; i < positions.length; i += 3) {
          const dx = intersectPoint.x - positions[i];
          const dy = intersectPoint.y - positions[i + 1];
          const dz = intersectPoint.z - positions[i + 2];
          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

          if (dist < 1.2) {
            const force = (1 - dist / 1.2) * 0.004;
            positions[i] += dx * force;
            positions[i + 1] += dy * force;
            positions[i + 2] += dz * force;
          } else {
            positions[i] += (originalPositions[i] - positions[i]) * 0.02;
            positions[i + 1] += (originalPositions[i + 1] - positions[i + 1]) * 0.02;
            positions[i + 2] += (originalPositions[i + 2] - positions[i + 2]) * 0.02;
          }
        }

        for (const { index, axis, amplitude, speed, phase } of animationParams) {
          const base = originalPositions[index + axis];
          positions[index + axis] = base + Math.sin(t * speed + phase) * amplitude;
        }

        particlePositions.needsUpdate = true;
      }

      const screenPos = hotspotTarget.clone().project(camera);
      const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;
      hotspot.style.display = 'block';
      hotspot.style.left = `${x}px`;
      hotspot.style.top = `${y}px`;

      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
