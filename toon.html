<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Toon Shading</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js",
          "three/examples/jsm/loaders/DRACOLoader.js": "https://unpkg.com/three@0.158.0/examples/jsm/loaders/DRACOLoader.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js",
          "three/examples/jsm/effects/OutlineEffect.js": "https://unpkg.com/three@0.158.0/examples/jsm/effects/OutlineEffect.js"
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
      import { OutlineEffect } from 'three/examples/jsm/effects/OutlineEffect.js';

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.5, 3);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 7.5);
      scene.add(light);

      // GLTF + DRACO Loader setup
      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://unpkg.com/three@0.158.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(dracoLoader);

      loader.load('assets/somerobot.glb', (gltf) => {
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshToonMaterial({
              color: 0x6699ff,
              gradientMap: null
            });
          }
        });
        scene.add(gltf.scene);
      });

      const effect = new OutlineEffect(renderer);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        effect.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
