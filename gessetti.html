<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gessetto su Asfalto - Three.js</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui;
      touch-action: none; /* IMPORTANTE: Previene lo scroll su mobile */
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .ui {
      position: absolute;
      left: 12px;
      top: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
    }
    button {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      font-family: inherit;
      transition: all 0.2s;
    }
    button:hover { 
      background: rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }
    .color-picker {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .color-option {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.3);
      transition: transform 0.2s;
    }
    .color-option:hover {
      transform: scale(1.2);
    }
    .color-option.active {
      border-color: white;
      transform: scale(1.2);
    }
    .brush-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 6px;
      backdrop-filter: blur(6px);
    }
    .brush-size {
      color: white;
      font-size: 12px;
    }
    input[type="range"] {
      width: 80px;
    }
    .info {
      position: absolute;
      bottom: 12px;
      left: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 4px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>

  <div class="ui">
    <button id="clearBtn">Cancella</button>
    <button id="saveBtn">Salva</button>
    <div class="color-picker">
      <div class="color-option active" style="background-color: #ff3c3c;" data-color="#ff3c3c"></div>
      <div class="color-option" style="background-color: #3cff3c;" data-color="#3cff3c"></div>
      <div class="color-option" style="background-color: #3c3cff;" data-color="#3c3cff"></div>
      <div class="color-option" style="background-color: #ffff3c;" data-color="#ffff3c"></div>
      <div class="color-option" style="background-color: #ff3cff;" data-color="#ff3cff"></div>
      <div class="color-option" style="background-color: #ffffff;" data-color="#ffffff"></div>
    </div>
    <div class="brush-controls">
      <span class="brush-size">Dimensione:</span>
      <input type="range" id="brushSize" min="1" max="10" value="4" step="0.5">
    </div>
  </div>

  <div class="info">Disegna con il mouse o il dito per creare l'effetto gessetto</div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('container');

    // === SCENA 2D CON ASFALTO ===
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      preserveDrawingBuffer: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.style.touchAction = 'none'; // Importante per mobile
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x151515);

    // Camera ortografica per vista 2D piatta
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      -aspect, aspect, 1, -1, 0.1, 1000
    );
    camera.position.z = 5;
    camera.lookAt(0, 0, 0);

    // Luce semplice
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    // Creiamo una texture per l'asfalto più realistica
    function createAsphaltTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      
      // Colore di base scuro
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Aggiungiamo texture granulosa più pronunciata
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        // Rumore granuloso più forte per asfalto
        const n = Math.random() * 60;
        data[i] = Math.max(0, data[i] - n);
        data[i + 1] = Math.max(0, data[i + 1] - n);
        data[i + 2] = Math.max(0, data[i + 2] - n);
        
        // Aggiungiamo qualche punto più chiaro
        if (Math.random() > 0.95) {
          data[i] = 120;
          data[i + 1] = 120;
          data[i + 2] = 120;
        }
      }
      
      ctx.putImageData(imageData, 0, 0);
      
      // Aggiungiamo "crepe" e texture più realistiche
      ctx.strokeStyle = '#0a0a0a';
      ctx.lineWidth = 2;
      for (let i = 0; i < 25; i++) {
        ctx.beginPath();
        const x1 = Math.random() * canvas.width;
        const y1 = Math.random() * canvas.height;
        ctx.moveTo(x1, y1);
        for (let j = 0; j < 5; j++) {
          const x2 = x1 + (Math.random() - 0.5) * 100;
          const y2 = y1 + (Math.random() - 0.5) * 100;
          ctx.lineTo(x2, y2);
        }
        ctx.stroke();
      }
      
      return new THREE.CanvasTexture(canvas);
    }

    const asphaltTexture = createAsphaltTexture();
    asphaltTexture.wrapS = asphaltTexture.wrapT = THREE.RepeatWrapping;
    asphaltTexture.repeat.set(1.5, 1.5);

    // Piano asfalto 2D
    const planeWidth = aspect * 2;
    const planeHeight = 2;
    
    const asphaltGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
    const asphaltMaterial = new THREE.MeshBasicMaterial({
      map: asphaltTexture
    });

    const asphalt = new THREE.Mesh(asphaltGeometry, asphaltMaterial);
    scene.add(asphalt);

    // === SISTEMA DI DISEGNO CON EFFETTO GESSETTO ===
    let drawing = false;
    let currentColor = '#ff3c3c';
    let brushSize = 4;
    const chalkElements = [];

    // Materiali per diversi tipi di particelle di gesso
    function createChalkMaterial(color, opacity = 0.9) {
      return new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: opacity,
        depthWrite: false
      });
    }

    // Funzione per convertire le coordinate dello schermo in coordinate del mondo 2D
    function screenToWorld(x, y) {
      const rect = renderer.domElement.getBoundingClientRect();
      const worldX = ((x - rect.left) / rect.width) * 2 - 1;
      const worldY = -((y - rect.top) / rect.height) * 2 + 1;
      
      return new THREE.Vector3(
        worldX * aspect,
        worldY,
        0.1 // Leggermente davanti all'asfalto
      );
    }

    // Crea una particella di gesso con effetto polveroso
    function createChalkParticle(position, color) {
      const group = new THREE.Group();
      
      // Particella principale - più opaca al centro
      const mainSize = 0.01; // DIMENSIONE FISSA
      const mainGeometry = new THREE.CircleGeometry(mainSize, 6);
      const mainMaterial = createChalkMaterial(color, 0.7 + Math.random() * 0.3);
      const mainParticle = new THREE.Mesh(mainGeometry, mainMaterial);
      group.add(mainParticle);
      
      // Alone polveroso - più grande e trasparente (dimensione fissa in base al brushSize)
      const haloSize = mainSize * (1.5 + brushSize * 0.3);
      const haloGeometry = new THREE.RingGeometry(haloSize * 0.3, haloSize, 8);
      const haloMaterial = createChalkMaterial(color, 0.2 + Math.random() * 0.2);
      const halo = new THREE.Mesh(haloGeometry, haloMaterial);
      group.add(halo);
      
      // Micro particelle sparse attorno (numero fisso)
      const microParticlesCount = Math.floor(brushSize * 0.8);
      for (let i = 0; i < microParticlesCount; i++) {
        const microSize = mainSize * (0.2 + Math.random() * 0.3);
        const microGeometry = new THREE.CircleGeometry(microSize, 4);
        const microMaterial = createChalkMaterial(color, 0.4 + Math.random() * 0.3);
        const microParticle = new THREE.Mesh(microGeometry, microMaterial);
        
        microParticle.position.set(
          (Math.random() - 0.5) * haloSize * 1.2,
          (Math.random() - 0.5) * haloSize * 1.2,
          0
        );
        
        group.add(microParticle);
      }
      
      // Posizionamento con variazione casuale
      group.position.set(
        position.x + (Math.random() - 0.5) * 0.02,
        position.y + (Math.random() - 0.5) * 0.02,
        position.z + Math.random() * 0.05
      );
      
      // Rotazione casuale
      group.rotation.z = Math.random() * Math.PI * 2;
      
      scene.add(group);
      chalkElements.push(group);
      
      return group;
    }

    // Disegna una traccia di gesso tra due punti
    function drawChalkStroke(start, end, color) {
      const distance = Math.sqrt(
        Math.pow(end.x - start.x, 2) + Math.pow(end.y - start.y, 2)
      );
      
      // Numero di particelle basato sulla distanza e dimensione del pennello
      const segments = Math.max(3, Math.floor(distance * 30 * (brushSize / 4)));
      
      // Densità costante
      const density = 1.0;
      
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const point = new THREE.Vector3();
        point.lerpVectors(start, end, t);
        
        // Aggiungiamo rumore al percorso
        point.x += (Math.random() - 0.5) * 0.01;
        point.y += (Math.random() - 0.5) * 0.01;
        point.z = 0.1 + Math.random() * 0.05;
        
        // Creiamo particelle in base alla densità
        if (Math.random() < density) {
          createChalkParticle(point, color);
        }
      }
    }

    let lastPoint = null;

    // Funzioni separate per mouse e touch
    function handleStart(x, y) {
      drawing = true;
      const point = screenToWorld(x, y);
      lastPoint = point;
      createChalkParticle(point, currentColor);
    }

    function handleMove(x, y) {
      if (!drawing || !lastPoint) return;
      
      const point = screenToWorld(x, y);
      drawChalkStroke(lastPoint, point, currentColor);
      lastPoint = point;
    }

    function handleEnd() {
      drawing = false;
      lastPoint = null;
    }

    // Event listeners per mouse
    renderer.domElement.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handleStart(e.clientX, e.clientY);
    });

    renderer.domElement.addEventListener('mousemove', (e) => {
      e.preventDefault();
      handleMove(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', (e) => {
      e.preventDefault();
      handleEnd();
    });

    // Event listeners per touch - CORRETTI
    renderer.domElement.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        handleStart(touch.clientX, touch.clientY);
      }
    });

    renderer.domElement.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
      }
    });

    renderer.domElement.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleEnd();
    });

    renderer.domElement.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      handleEnd();
    });

    // Previene il menu contestuale
    renderer.domElement.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // === CONTROLLI UI ===
    document.getElementById('clearBtn').onclick = () => {
      chalkElements.forEach(element => scene.remove(element));
      chalkElements.length = 0;
    };

    document.getElementById('saveBtn').onclick = () => {
      const link = document.createElement('a');
      link.download = 'gessetto_asfalto.png';
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();
    };

    // Selezione colore
    document.querySelectorAll('.color-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.color-option').forEach(opt => {
          opt.classList.remove('active');
        });
        option.classList.add('active');
        currentColor = option.getAttribute('data-color');
      });
    });

    // Controllo dimensione pennello
    document.getElementById('brushSize').addEventListener('input', (e) => {
      brushSize = parseFloat(e.target.value);
    });

    // === RESIZE ===
    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const newAspect = width / height;
      
      renderer.setSize(width, height);
      
      // Aggiorna la camera ortografica
      camera.left = -newAspect;
      camera.right = newAspect;
      camera.top = 1;
      camera.bottom = -1;
      camera.updateProjectionMatrix();
      
      // Aggiorna le dimensioni del piano asfalto
      scene.remove(asphalt);
      const newGeometry = new THREE.PlaneGeometry(newAspect * 2, 2);
      asphalt.geometry = newGeometry;
      scene.add(asphalt);
    }

    window.addEventListener('resize', handleResize);

    // === LOOP ===
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
