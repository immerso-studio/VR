<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo di Vetro con Environment Map</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/CubeTextureLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Inizializzazione
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // High-quality HDR Environment Map
        const envMapUrls = [
            'https://threejs.org/examples/textures/cube/pisa/px.png',
            'https://threejs.org/examples/textures/cube/pisa/nx.png',
            'https://threejs.org/examples/textures/cube/pisa/py.png',
            'https://threejs.org/examples/textures/cube/pisa/ny.png',
            'https://threejs.org/examples/textures/cube/pisa/pz.png',
            'https://threejs.org/examples/textures/cube/pisa/nz.png'
        ];

        const cubeTextureLoader = new THREE.CubeTextureLoader();
        const envMap = cubeTextureLoader.load(envMapUrls);
        envMap.encoding = THREE.sRGBEncoding;
        scene.environment = envMap; // Imposta l'environment map globale

        // Materiale di vetro avanzato
                const glassMaterial = new THREE.MeshPhysicalMaterial({
                transmission: 1,
                transparent: true,
                opacity: 0.9,
                roughness: 0.05,
                metalness: 0.0,
                ior: 1.52,
                thickness: 2,
                specularIntensity: 1.0,
                specularColor: new THREE.Color(0x88ccee),
                color: new THREE.Color(0x88ccee),
                envMap: envMap,
                envMapIntensity: 2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                sheen: 1,
                sheenColor: new THREE.Color(0x88ccee),
                sheenRoughness: 0.2,
                attenuationDistance: 1,
                attenuationColor: new THREE.Color(0x037FE4),
                reflectivity: 3,
                iridescence: 0.5,
                iridescenceIOR: 1.3
                });

        // Cubo principale
        const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
        const cube = new THREE.Mesh(cubeGeometry, glassMaterial);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Illuminazione avanzata
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight1.position.set(2, 2, 2);
        directionalLight1.castShadow = true;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight2.position.set(-2, -2, -2);
        scene.add(directionalLight2);

        // Controlli mouse
        let mouseX = 0;
        let mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        function onMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) / windowHalfX;
            mouseY = (event.clientY - windowHalfY) / windowHalfY;
        }

        document.addEventListener('mousemove', onMouseMove, false);

        // Animazione
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotazione fluida verso il puntatore
            cube.rotation.y = THREE.MathUtils.lerp(cube.rotation.y, mouseX * 0.5, 0.1);
            cube.rotation.x = THREE.MathUtils.lerp(cube.rotation.x, -mouseY * 0.3, 0.1);
            
            renderer.render(scene, camera);
        }

        // Gestione resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
        }

        window.addEventListener('resize', onWindowResize, false);

        // Avvio
        animate();
    </script>
</body>
</html>
