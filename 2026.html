<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMMERSO STUDIO</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            padding: 2rem;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .menu-btn {
            cursor: pointer;
            font-size: 1rem;
        }

        /* --- MAIN STAGE --- */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* Container che mantiene le proporzioni dell'immagine originale.
           Regola 'max-width' in base a quanto grande vuoi il logo. */
        .immersive-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            /* Questo aspect-ratio è fondamentale: mantiene le posizioni 
               dei box sincronizzate con il logo */
            aspect-ratio: 16 / 9; 
        }

        /* --- LOGO SVG (SFONDO) --- */
        .logo-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 85, 255, 0.2));
        }

        .logo-path {
            fill: none;
            stroke: #0055ff; /* Il Blu Elettrico */
            stroke-width: 80; /* Spessore della linea */
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* --- HOTSPOTS (AREE CLICCABILI) --- */
        .hotspot {
            position: absolute;
            text-decoration: none;
            color: white;
            z-index: 10;
            /* Per il debug, puoi mettere outline: 1px solid red qui per vedere le aree */
        }

        /* Il riquadro di selezione (stile UI Design) */
        .selection-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #ffffff;
            opacity: 0; /* Nascosto di default */
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none; /* Lascia passare i click all'elemento padre */
        }

        /* I quadratini agli angoli del riquadro */
        .corner {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border: 1px solid black;
        }
        .c-tl { top: -3px; left: -3px; }
        .c-tr { top: -3px; right: -3px; }
        .c-bl { bottom: -3px; left: -3px; }
        .c-br { bottom: -3px; right: -3px; }

        /* Etichetta del testo */
        .label {
            position: absolute;
            background: #000;
            padding: 4px 8px;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s ease 0.1s; /* Leggero ritardo */
        }
        
        /* Posizionamento dinamico delle etichette (sopra, sotto, destra, sinistra) */
        .label.bottom-left { bottom: 10px; left: 10px; }
        .label.top-left { top: 10px; left: 10px; }
        .label.bottom-right { bottom: 10px; right: 10px; }
        .label.top-right { top: 10px; right: 10px; }

        .arrow { font-size: 0.8em; }

        /* --- INTERAZIONI (HOVER) --- */
        
        /* Quando passi sopra l'area hotspot */
        .hotspot:hover .selection-box {
            opacity: 1;
            transform: scale(1.02); /* Leggero zoom in per effetto "focus" */
        }
        
        .hotspot:hover .label {
            opacity: 1;
        }

        /* --- POSIZIONI SPECIFICHE (PERCENTUALI) --- 
           Queste coordinate sono stimate basandosi sulla tua immagine.
           Puoi aggiustarle modificando top/left/width/height.
        */

        /* Web Design (Alto Sinistra) */
        #spot-web {
            top: 10%; left: 15%; width: 15%; height: 35%;
        }
        
        /* Art Direction (Alto Destra) */
        #spot-art {
            top: 10%; right: 25%; width: 20%; height: 25%;
        }

        /* 3D Rendering (Basso Sinistra) */
        #spot-3d {
            top: 45%; left: 25%; width: 20%; height: 30%;
        }

        /* Branding (Basso Centro) */
        #spot-branding {
            bottom: 15%; left: 48%; width: 15%; height: 25%;
        }

        /* VR / AR / XR (Basso Destra) */
        #spot-vr {
            bottom: 20%; right: 15%; width: 18%; height: 25%;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .immersive-container {
                aspect-ratio: 1/1; /* Diventa quadrato su mobile */
                max-width: 100%;
            }

            /* Su mobile le etichette sono sempre visibili o hanno uno stile diverso */
            .selection-box {
                border-color: rgba(255, 255, 255, 0.3);
                opacity: 1; /* Sempre visibili su mobile */
            }
            
            .label {
                opacity: 1;
                font-size: 0.7rem;
                padding: 2px 5px;
            }

            /* Riorganizza il logo SVG per mobile se necessario tramite viewBox */
        }

    </style>
</head>
<body>

    <header>
        <div class="brand-name">Immerso Studio</div>
        <div class="menu-btn">Menu</div>
    </header>

    <main>
        <div class="immersive-container">
            
            <svg class="logo-svg" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
                <path class="logo-path" d="M150,100 Q200,400 300,300 T450,200 T600,350 L700,400" />
                <path class="logo-path" d="M250,100 Q300,350 400,250" style="opacity:0.8" />
                <path class="logo-path" d="M450,100 Q500,400 650,250" style="opacity:0.9" />
            </svg>

            <a href="/web-design" class="hotspot" id="spot-web">
                <div class="selection-box">
                    <span class="corner c-tl"></span><span class="corner c-tr"></span>
                    <span class="corner c-bl"></span><span class="corner c-br"></span>
                </div>
                <div class="label bottom-left">Web Design. <span class="arrow">➔</span></div>
            </a>

            <a href="/art-direction" class="hotspot" id="spot-art">
                <div class="selection-box">
                    <span class="corner c-tl"></span><span class="corner c-tr"></span>
                    <span class="corner c-bl"></span><span class="corner c-br"></span>
                </div>
                <div class="label bottom-left">Art Direction. <span class="arrow">➔</span></div>
            </a>

            <a href="/3d-rendering" class="hotspot" id="spot-3d">
                <div class="selection-box">
                    <span class="corner c-tl"></span><span class="corner c-tr"></span>
                    <span class="corner c-bl"></span><span class="corner c-br"></span>
                </div>
                <div class="label bottom-left">3D Rendering. <span class="arrow">➔</span></div>
            </a>

            <a href="/branding" class="hotspot" id="spot-branding">
                <div class="selection-box">
                    <span class="corner c-tl"></span><span class="corner c-tr"></span>
                    <span class="corner c-bl"></span><span class="corner c-br"></span>
                </div>
                <div class="label bottom-left">Branding. <span class="arrow">➔</span></div>
            </a>

            <a href="/vr-ar" class="hotspot" id="spot-vr">
                <div class="selection-box">
                    <span class="corner c-tl"></span><span class="corner c-tr"></span>
                    <span class="corner c-bl"></span><span class="corner c-br"></span>
                </div>
                <div class="label top-left">VR / AR / XR. <span class="arrow">➔</span></div>
            </a>

        </div>
    </main>

    <script>
        // JS Opzionale: Aggiunge un effetto di parallasse leggero al movimento del mouse
        const container = document.querySelector('.immersive-container');
        
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 768) { // Solo desktop
                const x = (window.innerWidth - e.pageX * 2) / 100;
                const y = (window.innerHeight - e.pageY * 2) / 100;
                
                container.style.transform = `translateX(${x}px) translateY(${y}px)`;
            }
        });
    </script>
</body>
</html>
