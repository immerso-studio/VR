<!DOCTYPE html>
<html lang="it">

                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                                                                      
                                                                                   
                                                                                                                      
                                                                                                                      
                                                                                                                      


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Glasses Scroll Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: #000;
            color: white;
            font-family: sans-serif;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        
        section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <section>
        <h1>THE FUTURE OF SPORTS GLASSES</h1>
        <p>Scroll to explore the 3D model</p>
    </section>
    
    <section>
        <h1>PRECISION ENGINEERED</h1>
        <p>For optimal performance</p>
    </section>
    
    <section>
        <h1>AVAILABLE NOW</h1>
    </section>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
                "GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/loaders/GLTFLoader.js",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js",
                "ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/ScrollTrigger.min.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'GLTFLoader';
        import { gsap } from 'gsap';
        import { ScrollTrigger } from 'ScrollTrigger';

        // Initialize GSAP
        gsap.registerPlugin(ScrollTrigger);

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        // Camera setup (matches original site perspective)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        // Renderer setup with exact same configuration
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Lighting setup (critical for visibility)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        
        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight1.position.set(1, 1, 1);
        scene.add(directionalLight1);
        
        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight2.position.set(-1, -1, -1);
        scene.add(directionalLight2);

        // Model loading with error handling
        const loader = new GLTFLoader();
        let model;
        
        loader.load(
            'assets/OakleyAnimV1.glb', 
            (gltf) => {
                model = gltf.scene;
                
                // Center and scale the model
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.sub(center);
                
                // Initial positioning and scaling
                model.scale.set(1.8, 1.8, 1.8);
                model.position.y = -0.3;
                
                scene.add(model);
                
                // Scroll animations (matches original site)
                gsap.to(model.rotation, {
                    y: Math.PI * 2,
                    scrollTrigger: {
                        trigger: "body",
                        start: "top top",
                        end: "bottom bottom",
                        scrub: 1.5,
                    }
                });
                
                gsap.to(model.position, {
                    z: 3.5,
                    scrollTrigger: {
                        trigger: "body",
                        start: "top top",
                        end: "bottom bottom",
                        scrub: 0.7,
                    }
                });
                
                // Additional scale animation
                gsap.to(model.scale, {
                    x: 2.2,
                    y: 2.2,
                    z: 2.2,
                    scrollTrigger: {
                        trigger: "section:nth-child(3)",
                        start: "top center",
                        end: "bottom center",
                        scrub: true,
                    }
                });
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('Error loading model:', error);
                // Fallback cube for debugging
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
            }
        );

        // Animation loop
        const animate = () => {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        };
        animate();

        // Responsive handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Debug output
        console.log('Three.js version:', THREE.REVISION);
        console.log('Canvas element:', renderer.domElement);
    </script>
</body>
</html>
