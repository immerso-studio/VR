<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Punti Interattivi UI</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    #infoCard {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #infoCardContent {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    #closeBtn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
    }

    #infoTitle {
      margin-top: 0;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="infoCard">
    <div id="infoCardContent">
      <span id="closeBtn">&times;</span>
      <h2 id="infoTitle"></h2>
      <p id="infoText"></p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    let scene, camera, renderer;
    let yawObject, pitchObject;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let clickableObjects = [];

    let isMouseDown = false;
    let prevMouseX = 0;
    let prevMouseY = 0;

    let isTouching = false;
    let prevTouchX = 0;
    let prevTouchY = 0;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      pitchObject = new THREE.Object3D();
      pitchObject.add(camera);

      yawObject = new THREE.Object3D();
      yawObject.position.y = 1.5;
      yawObject.add(pitchObject);

      scene.add(yawObject);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(10, 10, 10);
      scene.add(light);

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);
      loader.load('assets/Stanza-scansionata-1.glb', (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 0, 0);
        scene.add(model);
      });

      addInteractivePoint(new THREE.Vector3(1.7, 1.7, 0), '#ff0000', 'ROSSO');
      addInteractivePoint(new THREE.Vector3(-1.7, 0.9, -1), '#00ff00', 'VERDE');
      addInteractivePoint(new THREE.Vector3(-1.7, 1.2, 1), '#0000ff', 'BLU');

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Mouse
      window.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => {
        isMouseDown = false;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const deltaX = e.clientX - prevMouseX;
        const deltaY = e.clientY - prevMouseY;

        yawObject.rotation.y -= deltaX * 0.002;
        pitchObject.rotation.x -= deltaY * 0.002;
        pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));

        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      // Touch
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isTouching = true;
          prevTouchX = e.touches[0].clientX;
          prevTouchY = e.touches[0].clientY;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isTouching || e.touches.length !== 1) return;

        const touchX = e.touches[0].clientX;
        const touchY = e.touches[0].clientY;
        const deltaX = touchX - prevTouchX;
        const deltaY = touchY - prevTouchY;

        yawObject.rotation.y -= deltaX * 0.002;
        pitchObject.rotation.x -= deltaY * 0.002;
        pitchObject.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitchObject.rotation.x));

        prevTouchX = touchX;
        prevTouchY = touchY;
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        isTouching = false;

        if (e.changedTouches.length === 1) {
          const touch = e.changedTouches[0];
          const x = touch.clientX;
          const y = touch.clientY;

          mouse.x = (x / window.innerWidth) * 2 - 1;
          mouse.y = -(y / window.innerHeight) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(clickableObjects);

          if (intersects.length > 0) {
            const clickedName = intersects[0].object.name;
            showInfoCard(clickedName);
          }
        }
      }, { passive: true });

      window.addEventListener('click', onClick);
    }

    function createLabelSprite(text, color = '#00FFAA') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.beginPath();
      ctx.arc(128, 128, 20, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 25;
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(1, 1, 1);
      return sprite;
    }

    function addInteractivePoint(position, color, name) {
      const sprite = createLabelSprite(name, color);
      sprite.position.copy(position);
      sprite.name = name;
      scene.add(sprite);
      clickableObjects.push(sprite);
    }

    function onClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(clickableObjects);

      if (intersects.length > 0) {
        const clickedName = intersects[0].object.name;
        showInfoCard(clickedName);
      }
    }

    function showInfoCard(name) {
      const infoCard = document.getElementById('infoCard');
      const title = document.getElementById('infoTitle');
      const text = document.getElementById('infoText');

      const data = {
        'ROSSO': {
          title: 'Gli Affreschi: La Mano di Teodoro Ghisi',
          text: 'Il pregio maggiore dell\'Oratorio risiede negli affreschi che ne decorano la volta absidale...'
        },
        'VERDE': {
          title: 'Un Balconcino e Drastiche Trasformazioni',
          text: 'Originariamente, un dettaglio architettonico significativo era un balconcino...'
        },
        'BLU': {
          title: 'Iconografia degli Affreschi: Un Mistero da Svelare',
          text: 'Nonostante l\'attribuzione a Ghisi, i soggetti precisi degli affreschi rimangono in parte oscuri...'
        }
      };

      if (data[name]) {
        title.innerText = data[name].title;
        text.innerText = data[name].text;
        infoCard.style.display = 'flex';
      }
    }

    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('infoCard').style.display = 'none';
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
